# Слово.Проповеди — web (PWA) static server.
# Serves the `expo export -p web` output from /usr/share/nginx/html on port 8080.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ------------------------------------------------------------------
    # Security headers. CSP is intentionally permissive on media/img/
    # connect: artwork and audio come from many hosts and the API host
    # is not fixed at build time.
    # ------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # Service worker — must always be revalidated so updates land.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        types { application/javascript js; }
        default_type application/javascript;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Hashed bundle output — safe to cache forever. `^~` wins over the regex
    # extension-match location below (nginx: regex locations otherwise beat
    # plain prefix locations regardless of declaration order).
    location ^~ /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 7d;
        access_log off;
    }

    location ~ /\. {
        deny all;
    }

    # SPA fallback: unknown paths (deep links, reloads) serve the shell.
    location / {
        charset utf-8;
        try_files $uri $uri/ /index.html;
    }
}
