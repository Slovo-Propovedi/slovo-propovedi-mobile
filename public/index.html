<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%" class="has-splash">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>%WEB_TITLE%</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f16031" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Слово.Проповеди" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make html/body full-height and paint the reset area with the
         app brand colour. ThemeProvider overrides the background at runtime with
         the active theme, so a dark theme does not flash this light fallback on
         overscroll. `overscroll-behavior: none` kills the rubber-band area. */
      html,
      body {
        height: 100%;
        width: 100%;
        background-color: #f16031;
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* While the startup splash owns the screen, the app stays invisible: its
         layout/scrollbars can never show through the splash or shift the fixed
         splash when the viewport changes on mount. The class is set on <html>
         statically (no JS race) and removed by ThemeProvider in the same tick
         it drops #sp-splash. */
      html.has-splash #root {
        visibility: hidden;
      }
      /* Web startup splash: mirrors the native splash (image centered on the
         brand accent) while the JS bundle loads. It is a sibling of #root so
         React never touches it; ThemeProvider removes it once the app boots. */
      #sp-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background-color: #f16031;
        opacity: 1;
        transition: opacity 300ms ease;
      }
      /* Explicit fixed box (source is a square 307×307 PNG scaled to 152×152).
         Never derive the size from layout: keep the splash pixel-identical
         through mount, regardless of viewport/scrollbar changes. */
      #sp-splash img {
        width: 152px;
        height: 152px;
        object-fit: contain;
      }
      @media (prefers-color-scheme: dark) {
        #sp-splash {
          background-color: #000000;
        }
      }
    </style>

    <style id="sp-scrollbars">
      /*
       * Themed scrollbars. The vars are set from the active app theme by
       * ThemeProvider on web; the fallbacks are a theme-neutral grey so the
       * scrollbar looks fine before/without JS.
       */
      :root {
        --sp-scrollbar-thumb: rgba(136, 136, 136, 0.5);
        --sp-scrollbar-thumb-hover: rgba(136, 136, 136, 0.8);
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: var(--sp-scrollbar-thumb) transparent;
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track,
      ::-webkit-scrollbar-corner {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background-color: var(--sp-scrollbar-thumb);
        background-clip: content-box;
        border: 2px solid transparent;
        border-radius: 5px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: var(--sp-scrollbar-thumb-hover);
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <!-- Startup splash (native-like): removed by ThemeProvider once the app boots. -->
    <div id="sp-splash">
      <img src="/splash.png" alt="" />
    </div>

    <script>
      // Register the service worker (versioned precache + audio cache). Skipped
      // on localhost so it never interferes with the Metro dev server / HMR —
      // test the PWA from a production build (`expo export -p web`). sw.js is
      // in /public.
      //
      // This script only does the early ES5 registration. Background update
      // checks and the update confirmation modal live in the app bundle
      // (features/web-update): the SW precaches the whole dist manifest at
      // build time and serves it cache-first, so normal opens never hit the
      // server. New versions are detected by the bundle (60-min interval +
      // online + visibility), downloaded into a new cache bucket and left
      // WAITING; the user confirms the update in a modal, the page posts
      // SKIP_WAITING, the SW activates and the page reloads.
      (function () {
        var host = location.hostname;
        var isLocal = host === 'localhost' || host === '127.0.0.1' || host === '[::1]';
        if ('serviceWorker' in navigator && !isLocal) {
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('/sw.js').catch(function (error) {
              console.warn('[pwa] service worker registration failed:', error);
            });
          });
        } else if ('serviceWorker' in navigator && isLocal) {
          // Clean up a worker left over from a previous production-style run.
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) {
              reg.unregister();
            });
          });
        }
      })();
    </script>
  </body>
</html>
