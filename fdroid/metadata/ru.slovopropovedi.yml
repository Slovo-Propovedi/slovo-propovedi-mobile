MaintainerNotes: |
  ## F-Droid Build Recipe for Slovo Propovedi

  ### 1. FCM Strip Patch

  The expo-notifications module (v57.0.7) unconditionally includes Firebase Cloud
  Messaging at node_modules/expo-notifications/android/build.gradle line 43:

      implementation 'com.google.firebase:firebase-messaging:25.0.1'

  The app NEVER uses push notifications. It only uses local notifications via
  setNotificationHandler() and scheduleNotificationAsync({trigger: null}).
  The FCM dependency is stripped with a sed command in the prebuild step.

  ### 2. installreferrer Strip Patch

  expo-notifications transitively depends on expo-application (v57.0.2), which
  includes the proprietary Google Play Install Referrer library at
  node_modules/expo-application/android/build.gradle line 18:

      implementation 'com.android.installreferrer:installreferrer:2.2'

  This is proprietary Google Play tracking infrastructure. It is stripped with
  a sed command in the prebuild step. The app does not use install attribution.

  ### 3. ShortcutBadger Strip Patch

  expo-notifications includes ShortcutBadger at line 45:

      implementation 'me.leolin:ShortcutBadger:1.1.22@aar'

  This is an open-source badge-count library, but the app only uses local
  notifications and does not display badge counts. It is stripped for
  minimization. ShortcutBadger itself is Apache-2.0 licensed, so this is
  optional — include it if F-Droid reviewers prefer minimal deps.

  ### 4. Expo Autolinking Build-From-Source

  F-Droid requires all native code to be built from source. The following
  configuration is applied to package.json during prebuild:

      "expo": {
        "autolinking": {
          "android": {
            "buildFromSource": [".*"]
          }
        }
      }

  This ensures all Expo modules are compiled from their source in node_modules
  rather than downloading prebuilt AAR/JAR artifacts, which would break
  reproducible builds.

  ### 5. Per-ABI Builds

  F-Droid prefers separate APKs per ABI for smaller downloads. Build each
  architecture separately:

      cd android && ./gradlew assembleProdRelease -PreactNativeArchitectures=arm64-v8a
      cd android && ./gradlew assembleProdRelease -PreactNativeArchitectures=armeabi-v7a
      cd android && ./gradlew assembleProdRelease -PreactNativeArchitectures=x86_64

  The project default in gradle.properties includes all four ABIs:
  armeabi-v7a, arm64-v8a, x86, x86_64

  ### 5a. Build Flavors (prod for F-Droid)

  The project defines Gradle product flavors `dev` and `prod` (dimension
  `env`). F-Droid MUST build the **prod** flavor: `./gradlew assembleProdRelease`.
  The `dev` flavor carries an `applicationIdSuffix` (`.dev`) and
  `versionNameSuffix` (`-dev`) and is intended for local development only —
  it would not match the F-Droid Application ID (`ru.slovopropovedi`) nor the
  declared `versionName`. The aggregate `assembleRelease` task builds BOTH
  flavors and must not be used.

  ### 6. Reproducible Builds

  This app uses Hermes JS engine (hermesEnabled=true) with React Native 0.86.0
  and Expo SDK 57. EAS Cloud builds are NOT bit-reproducible. F-Droid builds
  must be done locally. To improve reproducibility:

  - Pin Node.js version (>= 22.x, currently v22.23.1)
  - Pin Yarn version (classic 1.22.x)
  - Pin JDK version (>= 17, OpenJDK)
  - Gradle 9.0.0 (via wrapper)
  - Android SDK API 35+, build-tools 35.0.0

  Exact bit-for-bit reproducibility may require additional patches to remove
  timestamps and non-deterministic build artifacts. This is documented as a
  goal but may not be achieved in the initial F-Droid submission.

  ### 7. Server URL Configuration

  The app has a user-configurable server URL accessible via the Settings screen.
  Default: https://api.slovo-propovedi.ru

  This is NOT a TetheredNet anti-feature because:
  - The server URL is changeable at runtime by the user
  - The app works with any compatible backend
  - There is no account system or vendor lock-in
  - Users can self-host the backend

  ### 8. YouTube Removal

  YouTube playback library fully removed (no `react-native-youtube` dep, no API
  client). URL fields retained in sermon data model for backend API compatibility
  — these are plain strings, not YouTube integration.

  ### 9. Signing Configuration

  Default local release builds use the debug keystore
  (`signingConfig signingConfigs.debug` in `android/app/build.gradle:112-122`).
  F-Droid reproducible builds will replace this with F-Droid's own signing key.

  Maintainer TODO: pin the debug-keystore SHA-256 fingerprint here for
  reproducibility verification (fingerprint not yet captured).

  ### 10. Known Issues / TODO

  - The commit placeholder 'v0.0.0' in the build entry must be replaced with a
    real git tag once the project creates release tags.
  - F-Droid may require a signing key separate from the debug keystore.
    The current build.gradle uses the debug signing config for release builds.
  - The REUSE.toml annotations at the project root already cover fdroid/**/*.yml
    with GPL-3.0-or-later, so the metadata file is SPDX-compliant.
  - Verify Forgejo/Gitea Changelog URL format (`/commits/branch/main` vs
    `/commits/?ref=main`). The current URL follows Forgejo conventions but
    should be tested before F-Droid submission.
