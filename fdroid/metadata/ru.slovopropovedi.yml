Summary: Listen to and read Christian sermons

Description: |-
  Slovo Propovedi (Слово.Проповеди) is a free and libre open source
  application for listening to and reading Christian sermons.

  Features:
  * Audio playback of sermon playlists with background playback and media controls
  * FB2 format book reader for offline reading
  * User-configurable server URL — no vendor lock-in, works with any compatible backend
  * Local notifications only — no proprietary push notification services
  * No tracking, no advertising, no analytics
  * Russian-language interface

  Licensed under GNU General Public License v3.0 or later (GPL-3.0-or-later).
  The source code is fully available. This app contains no proprietary components,
  no non-free network services, and no user tracking.

Repo: https://git.lightnode.ru/Slovo_Propovedi/slovo-propovedi-mobile.git
RepoType: git
Builds:
  - versionName: '0.10.0'
    versionCode: 1000
    commit: v0.10.0
    output: android/app/build/outputs/apk/prod/release/app-prod-release.apk
    prebuild: |
      # Strip FCM (Firebase Cloud Messaging) from expo-notifications.
      # Line 43 of node_modules/expo-notifications/android/build.gradle contains:
      #   implementation 'com.google.firebase:firebase-messaging:25.0.1'
      # This is pulled unconditionally but never used — the app only uses local
      # notifications via scheduleNotificationAsync({trigger: null}).
      sed -i "/firebase-messaging/d" node_modules/expo-notifications/android/build.gradle

      # Strip installreferrer from expo-application (transitive dep of expo-notifications).
      # Line 18 of node_modules/expo-application/android/build.gradle contains:
      #   implementation 'com.android.installreferrer:installreferrer:2.2'
      # This is proprietary Google Play tracking and must not be included.
      sed -i "/installreferrer/d" node_modules/expo-application/android/build.gradle

      # Strip ShortcutBadger from expo-notifications (not needed for local-only notifications).
      # Line 45 of node_modules/expo-notifications/android/build.gradle contains:
      #   implementation 'me.leolin:ShortcutBadger:1.1.22@aar'
      sed -i "/ShortcutBadger/d" node_modules/expo-notifications/android/build.gradle

      # Enable Expo autolinking buildFromSource for reproducible source builds.
      # This tells Expo to build all native modules from source rather than
      # downloading prebuilt binaries (which would break reproducibility).
      node -e "
        const fs = require('fs');
        const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
        pkg.expo = pkg.expo || {};
        pkg.expo.autolinking = pkg.expo.autolinking || {};
        pkg.expo.autolinking.android = pkg.expo.autolinking.android || {};
        pkg.expo.autolinking.android.buildFromSource = ['.*'];
        fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
      "
    build: |
      yarn install --frozen-lockfile
      cd android && ./gradlew assembleProdRelease
    scandelete:
      - node_modules/

