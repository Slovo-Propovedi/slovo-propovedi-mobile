// Clear the release signingConfig so assemble*Release emits an UNSIGNED APK.
// Used by the GitHub-hosted release pipeline when no keystore is available:
// the unsigned APK is built here and signed later by actions/sign-android.
// This init script lives outside android/ so it survives `expo prebuild --clean`.
// Without it, android/app/build.gradle falls back to the debug keystore for
// release builds when RELEASE_STORE_FILE is unset.
allprojects { project ->
  project.plugins.withId('com.android.application') {
    project.afterEvaluate {
      project.android.buildTypes.release.signingConfig = null
    }
  }
}
