name: Publish web (manual)

# Web-only publish WITHOUT an OTA bundle — for changes that affect only the PWA
# (or when installed builds do not need the hotfix). Same web path as
# ota-publish.yml / release.yml: export, image, VPS deploy; no xprem publish, no
# Forgejo release, no APK.
#
# NO js-only / RUNTIME_VERSION gate here (unlike ota-publish.yml): that gate
# exists only for OTA runtimeVersion compatibility — an OTA bundle can only
# reach APKs that already carry its runtimeVersion. The web bundle is
# independent of the native runtime, so a web publish is safe from any ref.
# Native changes ship through a tagged release (release.yml), not this
# workflow — use it when the change is PWA-only or installed builds do not need
# the update.
#
# Run: Forgejo → Actions → «Publish web (manual)» → Run workflow → pick the
# branch. The branch name becomes the deployment label and registry tag; the
# grammar guards below reject anything unsafe.
#
# Fatal by design: missing web vars, a failed export or a failed VPS deploy
# fail the run — without dist/ or a deployed image there is nothing to ship.
#
# Summary: the header and every executed step append their row to
# $GITHUB_STEP_SUMMARY (see scripts/ci/step-summary.sh); the always() footer
# turns the outcomes into one verdict: 🎉 web published, ⚠️ skipped/not
# reported, ❌ a fatal step broke. An empty outcome means the step never ran.

on:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-24.04

    # Same group as release.yml / ota-publish.yml: the export is memory-heavy
    # and the runner host is 4 GB, so manual publishes queue instead of
    # overlapping a build (see release.yml for the OOM context).
    concurrency:
      group: memory-heavy-jobs
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # No tag diffing: there is no js-only/RUNTIME_VERSION gate here.
          fetch-depth: 1

      # Opens the summary: later steps append their own rows in step order, so
      # the report accumulates into one readable page. `|| true` keeps the
      # cosmetic summary from failing the publish on exotic runners.
      - name: Write summary header
        run: |
          set -e
          SHORT_SHA="${GITHUB_SHA:-unknown}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          {
            echo "## Manual web publish — \`${{ github.ref_name }}\`"
            echo ''
            echo "- Commit: \`$SHORT_SHA\` · $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ''
          } | scripts/ci/step-summary.sh || true

      - name: Validate required web vars
        id: webvars
        env:
          BACKEND_API_HOSTNAME: ${{ vars.BACKEND_API_HOSTNAME }}
          LANDING_HOSTNAME: ${{ vars.LANDING_HOSTNAME }}
          WEB_HOSTNAME: ${{ vars.WEB_HOSTNAME }}
          MIRROR_CODEBERG_URL: ${{ vars.MIRROR_CODEBERG_URL }}
          MIRROR_GITHUB_URL: ${{ vars.MIRROR_GITHUB_URL }}
          MOBILE_REPOSITORY_NAME: ${{ vars.MOBILE_REPOSITORY_NAME }}
          # Registry push token — publishes push the images to the registry
          # the same way, so the push token is required; validate it here.
          PACKAGE_REGISTRY_TOKEN: ${{ secrets.PACKAGE_REGISTRY_TOKEN }}
        run: |
          set -e

          {
            echo ''
            echo '### Web'
          } | scripts/ci/step-summary.sh || true

          missing=0
          missing_list=""
          for v in BACKEND_API_HOSTNAME LANDING_HOSTNAME WEB_HOSTNAME MIRROR_CODEBERG_URL MIRROR_GITHUB_URL MOBILE_REPOSITORY_NAME PACKAGE_REGISTRY_TOKEN; do
            if [ -z "${!v}" ]; then
              echo "::error::Required Forgejo variable $v is not set (org- or repo-level vars) — refusing to build"
              missing=1
              missing_list="$missing_list \`$v\`"
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "vars=missing" >> "$GITHUB_OUTPUT"
            printf '%s\n' "- Required vars: ❌ missing$missing_list" | scripts/ci/step-summary.sh || true
          else
            echo "vars=ok" >> "$GITHUB_OUTPUT"
            printf '%s\n' "- Required vars: ✅" | scripts/ci/step-summary.sh || true
          fi
          exit $missing

      # The composite installs deps and exports dist/ with the constrained
      # (4 GB runner) memory caps; all host/mirror env comes from the caller.
      - name: Export web
        id: webexport
        uses: ./actions/release-web
        with:
          profile: constrained
        env:
          # Inlined into the web bundle by Metro at export time (see
          # src/shared/config/config.ts, src/pages/share/lib/constants.ts).
          EXPO_PUBLIC_BACKEND_API_HOSTNAME: ${{ vars.BACKEND_API_HOSTNAME }}
          EXPO_PUBLIC_LANDING_HOSTNAME: ${{ vars.LANDING_HOSTNAME }}
          EXPO_PUBLIC_WEB_HOSTNAME: ${{ vars.WEB_HOSTNAME }}
          EXPO_PUBLIC_MIRROR_CODEBERG_URL: ${{ vars.MIRROR_CODEBERG_URL }}
          EXPO_PUBLIC_MIRROR_GITHUB_URL: ${{ vars.MIRROR_GITHUB_URL }}
          EXPO_PUBLIC_MOBILE_REPOSITORY_NAME: ${{ vars.MOBILE_REPOSITORY_NAME }}

      - name: Check deploy config
        id: deploycfg
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          WEB_HOSTNAME: ${{ vars.WEB_HOSTNAME }}
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$WEB_HOSTNAME" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::VPS_HOST secret or WEB_HOSTNAME variable not set — skipping VPS deploy"
            printf '%s\n' "- Deploy: ⏭️ skipped (VPS_HOST secret or WEB_HOSTNAME variable not set)" | scripts/ci/step-summary.sh || true
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH
        if: steps.deploycfg.outputs.deploy == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          # The VPS host key is pinned from the org secret VPS_SSH_KNOWN_HOSTS
          # (`ssh-keyscan <VPS_HOST>` output, captured once and verified against
          # the server). A per-run ssh-keyscan on a fresh runner would trust
          # whatever key answers, i.e. offer no MITM protection.
          if [ -z "$VPS_SSH_KNOWN_HOSTS" ]; then
            echo "::error::VPS_SSH_KNOWN_HOSTS is not set — add the pinned VPS host key as a Forgejo org secret."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # Applies to every ssh/scp call in this job: an unknown or changed
          # host key aborts instead of being accepted.
          printf 'StrictHostKeyChecking yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Build and push web image to the registry
        if: steps.deploycfg.outputs.deploy == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          PACKAGE_REGISTRY_TOKEN: ${{ secrets.PACKAGE_REGISTRY_TOKEN }}
          REPOSITORY_URL: ${{ github.server_url }}
          BUILDX_BUILDER: ${{ vars.BUILDX_BUILDER }}
          DEPLOY_TAG: ${{ github.ref_name }}
          REGISTRY_USER: ${{ github.repository_owner }}
        run: |
          set -e
          # Docker CLI + buildx are not part of the runner image: install
          # pinned static builds into the job (no daemon — the CLI talks to the
          # VPS daemon over SSH via DOCKER_HOST).
          DOCKER_CLI_VERSION=27.5.1
          BUILDX_VERSION=0.20.1
          mkdir -p "$HOME/.docker-cli"
          curl -fsSL "https://download.docker.com/linux/static/stable/x86_64/docker-${DOCKER_CLI_VERSION}.tgz" \
            | tar xz -C "$HOME/.docker-cli" --strip-components=1 docker/docker
          curl -fsSL -o "$HOME/.docker-cli/docker-buildx" \
            "https://github.com/docker/buildx/releases/download/v${BUILDX_VERSION}/buildx-v${BUILDX_VERSION}.linux-amd64"
          chmod +x "$HOME/.docker-cli/docker-buildx"
          export PATH="$HOME/.docker-cli:$PATH"

          # A manual run has no tag: the branch name becomes the deployment
          # label — and the registry tag. Registry tag grammar applies: only
          # [A-Za-z0-9._-], no leading `.` or `-`, at most 128 bytes, and the
          # literal name `latest` is rejected so a branch never shadows the
          # implicit `latest` tag anchored to releases.
          case "$DEPLOY_TAG" in
            '')
              echo '::error::DEPLOY_TAG is empty — refusing to build'
              exit 1 ;;
          esac
          case "$DEPLOY_TAG" in
            .*)
              echo "::error::DEPLOY_TAG ($DEPLOY_TAG) must not start with '.'"
              exit 1 ;;
            -*)
              echo "::error::DEPLOY_TAG ($DEPLOY_TAG) must not start with '-'"
              exit 1 ;;
          esac
          case "$DEPLOY_TAG" in
            *[!A-Za-z0-9._-]*)
              echo "::error::DEPLOY_TAG ($DEPLOY_TAG) contains a character outside [A-Za-z0-9._-]"
              exit 1 ;;
          esac
          if [ "${#DEPLOY_TAG}" -gt 128 ]; then
            echo "::error::DEPLOY_TAG ($DEPLOY_TAG) exceeds the 128-character registry tag limit"
            exit 1
          fi
          if [ "$DEPLOY_TAG" = latest ]; then
            echo '::error::DEPLOY_TAG "latest" is reserved for release-anchored tags'
            exit 1
          fi

          REGISTRY_HOST="${REPOSITORY_URL#https://}"
          # Image names must be lowercase: owner/repo come from the runner's
          # GITHUB_REPOSITORY env lowercased whole (${var,,}), so no org is
          # hardcoded and the ref always matches this repo's Packages tab
          # auto-link (Forgejo matches owner/repo case-insensitively).
          REGISTRY_IMAGE="${REPOSITORY_URL#*://}/${GITHUB_REPOSITORY,,}"
          IMAGE_REF="${REGISTRY_IMAGE}/web"
          echo "IMAGE_REF=$IMAGE_REF" >> "$GITHUB_ENV"

          # Login writes only to this job's docker config; buildx forwards the
          # credentials to the remote builder for the push. Never printed.
          printf '%s' "$PACKAGE_REGISTRY_TOKEN" \
            | docker login "$REGISTRY_HOST" --username "$REGISTRY_USER" --password-stdin

          export DOCKER_HOST="ssh://$VPS_SSH_USER@$VPS_HOST"
          # Builder records live in THIS client's local store (~/.docker/buildx),
          # not on the daemon: a fresh job has no record of the host's
          # pre-provisioned $BUILDX_BUILDER (playbook role `slovo-buildx`), so
          # `--builder` would fail with "no builder found" even though its
          # buildkit container runs on the VPS. Adopt the builder idempotently
          # while the job's local record is missing (buildx 0.20 semantics,
          # verified against the release source):
          #   - container already present on the daemon -> `create` just saves
          #     the local record and `--bootstrap` only probes the RUNNING
          #     container (start on a running container is a no-op, nothing is
          #     restarted) — its layer cache stays intact;
          #   - container absent (first release / host rebuilt) -> recreated
          #     with the EXACT `slovo-buildx` role parameters, so a CI-created
          #     builder matches the playbook one;
          #   - parallel jobs racing the same first create -> buildx treats a
          #     container-name conflict ("already in use") as adopt-and-wait,
          #     so the loser ends up on the winner's container.
          if ! docker buildx inspect "$BUILDX_BUILDER" >/dev/null 2>&1; then
            docker buildx create \
              --name "$BUILDX_BUILDER" \
              --driver docker-container \
              --driver-opt "memory=1g" \
              --driver-opt "cpu-quota=80000" \
              --bootstrap >/dev/null
          fi
          # Single-platform linux/amd64 like the former on-VPS build — the 4 GB
          # host gets no multi-arch builds. The dist/ export produced above is
          # shipped by buildx as the build context, so no tar over SSH. Only
          # the $DEPLOY_TAG is pushed here — never :latest, which must track
          # tagged releases only.
          docker buildx build \
            --builder "$BUILDX_BUILDER" \
            --platform linux/amd64 \
            --push \
            --tag "$IMAGE_REF:$DEPLOY_TAG" \
            --build-arg OCI_IMAGE_SOURCE="${REPOSITORY_URL}/${GITHUB_REPOSITORY}" \
            .

      - name: Deploy to VPS
        id: deploy
        if: steps.deploycfg.outputs.deploy == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          WEB_HOSTNAME: ${{ vars.WEB_HOSTNAME }}
          # Shared infra names (org vars mirroring the playbook).
          TRAEFIK_NETWORK: ${{ vars.TRAEFIK_NETWORK }}
          TRAEFIK_SERVICE: ${{ vars.TRAEFIK_SERVICE }}
          BUILDX_BUILDER: ${{ vars.BUILDX_BUILDER }}
          # A manual run has no tag: the branch name is the deployment label.
          DEPLOY_TAG: ${{ github.ref_name }}
        run: |
          SSH_TARGET="${VPS_SSH_USER:-root}@$VPS_HOST"
          if [ -z "${IMAGE_REF:-}" ]; then
            echo "::error::IMAGE_REF is not set — the registry build step must export it"
            exit 1
          fi
          # Every value is shell-quoted for the remote shell (printf %q): a quote
          # in a ref name or variable can never break out of its argument.
          REMOTE_ENV="$(printf 'DEPLOY_TAG=%q IMAGE_REF=%q WEB_HOSTNAME=%q TRAEFIK_NETWORK=%q TRAEFIK_SERVICE=%q BUILDX_BUILDER=%q' \
            "$DEPLOY_TAG" "$IMAGE_REF" "$WEB_HOSTNAME" "$TRAEFIK_NETWORK" "$TRAEFIK_SERVICE" "$BUILDX_BUILDER")"
          # The image was built and pushed in the previous step; the deploy only
          # pulls it — nothing but the script itself crosses the SSH session.
          if scp scripts/vps-deploy-web.sh "$SSH_TARGET:/tmp/vps-deploy-web.sh" \
             && ssh "$SSH_TARGET" \
                  "chmod +x /tmp/vps-deploy-web.sh && $REMOTE_ENV bash /tmp/vps-deploy-web.sh"; then
            echo "result=deployed" >> "$GITHUB_OUTPUT"
            printf '%s\n' "- Deploy: ✅ https://$WEB_HOSTNAME ($DEPLOY_TAG)" | scripts/ci/step-summary.sh || true
          else
            # The deploy is fatal — the run goes red; the row only makes the
            # summary self-explanatory.
            echo "result=failed" >> "$GITHUB_OUTPUT"
            printf '%s\n' "- Deploy: ⚠️ failed (see log)" | scripts/ci/step-summary.sh || true
            exit 1
          fi

      # Footer: always runs, so the summary ends with a verdict even when a
      # step above failed and skipped the rest. Composite actions write no
      # custom outputs, so the export state comes from its step outcome.
      - name: Run summary
        if: always()
        env:
          WEB_VARS_OUTCOME: ${{ steps.webvars.outcome }}
          WEB_EXPORT_OUTCOME: ${{ steps.webexport.outcome }}
          DEPLOY_ENABLED: ${{ steps.deploycfg.outputs.deploy }}
          DEPLOY_RESULT: ${{ steps.deploy.outputs.result }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          summary_row() { printf '%s\n' "$1" | scripts/ci/step-summary.sh || true; }

          case "$WEB_EXPORT_OUTCOME:$DEPLOY_ENABLED:$DEPLOY_RESULT" in
            success:true:deployed) WEB='✅ deployed' ;;
            success:true:*) WEB='⚠️ export ok, deploy not reported' ;;
            success:false:*) WEB='✅ exported, deploy ⏭️ skipped' ;;
            failure:*) WEB='❌ export failed' ;;
            *) WEB='⏭️ skipped' ;;
          esac

          if [ "$WEB_VARS_OUTCOME" = 'failure' ]; then
            VERDICT='❌ failed — required web vars are missing (see log)'
          elif [ "$WEB_EXPORT_OUTCOME" = 'failure' ]; then
            VERDICT='❌ failed — web export broke (see log)'
          elif [ "$DEPLOY_OUTCOME" = 'failure' ]; then
            VERDICT='❌ failed — VPS deploy broke (see log)'
          elif [ "$WEB_VARS_OUTCOME" = 'success' ] && [ -z "$WEB_EXPORT_OUTCOME" ]; then
            VERDICT='❌ failed — web export never ran (see log)'
          elif [ "$WEB_EXPORT_OUTCOME" = 'success' ] && [ "$DEPLOY_RESULT" = 'deployed' ]; then
            VERDICT='🎉 done: web published'
          else
            VERDICT="⚠️ finished with warnings — web: $WEB"
          fi

          {
            echo ''
            echo '---'
            echo ''
            echo "**Result:** $VERDICT"
          } | scripts/ci/step-summary.sh || true

      - name: Cleanup workspace
        if: always()
        run: |
          rm -rf node_modules .yarn/cache .expo jest-cache dist 2>/dev/null || true
          find . -name '*.tsbuildinfo' -type f -delete 2>/dev/null || true
          find . -name '.cache' -type d -delete 2>/dev/null || true
