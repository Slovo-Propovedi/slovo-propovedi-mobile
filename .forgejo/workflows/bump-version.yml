name: Bump version (manual)

# Manual release bump: runs scripts/bump-version.mjs on the Forgejo runner
# (the same script as a local `yarn bump-version`) and publishes the result so
# the release pipeline can take over. TWO jobs, so the runner slot is released
# before the CI wait begins:
#
# job `bump` — commits and pushes, never waits:
#   guard / identity — branch, input, PAT and actor checks; git identity is
#                the dispatching user (see below).
#   bump       — rewrites the version files, promotes CHANGELOG.md
#                `[Unreleased]` and the fastlane `unreleased.txt` files,
#                commits with -s (DCO) and creates the annotated tag vX.Y.Z —
#                all LOCAL. Node builtins + bash scripts only, so no
#                node_modules are needed. That tag dies with the runner; job
#                `tag` recreates it on the pushed commit.
#   push-main  — pushes the bump commit with a PAT. This is what makes ci.yml
#                run on that commit (its trigger is `push: branches: [main]`),
#                and the job then ENDS, freeing the slot ci.yml needs.
#
# job `tag` — needs: bump, holds one slot while CI runs in the other:
#   wait-ci    — polls the commit-status API until `CI / checks` is green on
#                the bump commit (`needs.bump.outputs.sha`, NOT github.sha,
#                which is the pre-bump commit at dispatch time). A red commit
#                is never tagged.
#   push-tag   — recreates the annotated tag on that commit and pushes vX.Y.Z,
#                which triggers release.yml (`on: push: tags: 'v*'`). Native
#                vs js-only is decided THERE by
#                scripts/ci/detect-native-changes.sh — the same script the
#                bump used to pick its mode, so the two always agree. CI is
#                already green, so release.yml's own CI wait passes instantly.
#
# CAVEAT — the split requires runner capacity >= 2: `tag` holds a slot while
# ci.yml runs in another. At capacity 1 the wait starves CI again (exactly the
# deadlock this structure avoids) — raise the capacity or use the manual flow.
# release.yml's create-release polls while other jobs run in the same way.
#
# Run: Forgejo → Actions → «Bump version (manual)» → Run workflow.
#   bump — `major` | `minor` | `patch`, or a concrete `vX.Y.Z` / `X.Y.Z`
#          (the script strips the leading `v`). Required.
# The input field renders only on a recent Forgejo (one that exposes `inputs`
# under workflow_dispatch). On an older server the dialog has no field, the
# input stays empty and the guard fails — upgrade the server rather than
# working around the guard.
#
# PREREQUISITE — the release-notes contract from AGENTS.md: `CHANGELOG.md`
# `[Unreleased]` must contain notes, and both
# fastlane/metadata/android/{en-US,ru}/changelogs/unreleased.txt must be
# filled. The script promotes them into the release section and the versioned
# changelog files, and FAILS on an empty section — a dispatcher who forgot the
# notes gets a red run before anything is committed. Those notes are also what
# CI extracts into the Forgejo release body.
#
# Why a PAT (`RELEASE_BUMP_TOKEN`, org-level secret, repo content write): in
# Forgejo, events caused by the built-in `secrets.GITHUB_TOKEN` user are
# dropped by the notifier, so a push made with the automatic token NEVER
# triggers another workflow. Both the main push and the tag push must
# authenticate as a real maintainer account — otherwise neither ci.yml nor
# release.yml would start, and the run would go green having released nothing.
# `FORGEJO_`-prefixed secret names are reserved by Forgejo, hence this name.
#
# Why main is pushed before the CI wait and the tag after it: a commit status
# exists only for a pushed commit, so CI cannot run on a local-only bump
# commit. And release.yml's `create-release` waits for `CI / checks` for at
# most 15 minutes, a budget that starts when the tag lands — tagging only
# after CI passed leaves it to what it was designed for (the GitHub build
# queue) instead of spending it on the whole check run.
#
# git identity: the bump commit and its DCO trailer are signed by the user who
# dispatched the run (`github.actor`), not a bot. The email comes from the
# Forgejo user API when the user publishes it; otherwise the instance-
# resolvable `<actor>@noreply.<domain>` is used, which Forgejo attributes back
# to the account.
#
# Recovery, per stage:
#   * job `bump` failed — nothing was pushed; fix the cause and re-dispatch.
#   * main push rejected (non-fast-forward: someone pushed meanwhile, stale
#     checkout) — most likely nothing was mutated on the remote, but that is
#     not provable for a transport failure: verify with
#     `git ls-remote origin main` against the runner's `git rev-parse HEAD`,
#     then re-dispatch.
#   * main pushed, CI red / superseded / timed out — the tag was never
#     pushed: fix the failure on main, then create and push the tag from a
#     maintainer clone
#     (`git tag -a vX.Y.Z -m vX.Y.Z <bump-sha> && git push origin vX.Y.Z`).
#   * main pushed, tag push failed — do NOT re-dispatch the same version (the
#     bump commit is already on main, so a second bump commit would be created
#     and the tag would be rejected as existing): recover with a manual
#     `git push origin vX.Y.Z` from a clone that has the tag.
#
# Each job writes its own summary rows (scripts/ci/step-summary.sh); job `tag`
# ends with an always() footer verdict: 🎉 bump on main + CI green + tag
# pushed, ⏭️ the tag was already there, ❌ failed at a named stage. A red job
# `bump` is the signal itself — the tag job never starts.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'major | minor | patch, or a concrete vX.Y.Z (e.g. v1.2.3 — the script strips the v prefix)'
        required: true
        type: string

# Applies to the whole run (both jobs): two manual bumps would otherwise race
# the same CHANGELOG section and the same tag. Deliberately NOT
# `memory-heavy-jobs`: this workflow builds nothing (node builtins + bash
# only), and its `tag` job waits on CI — it must never hold the 4 GB host's
# build slot, same exclusion rationale as release.yml's create-release.
concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-24.04

    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.push-main.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history + tags: bump-version.mjs diffs HEAD against the latest
          # release tag to choose native vs js-only, and the push must
          # fast-forward `main`.
          fetch-depth: 0
          fetch-tags: true
          # The automatic token must not be persisted as a git credential: it
          # would shadow the PAT push below, and its pushes trigger no workflow
          # anyway (Forgejo drops events from the internal Actions user).
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # All-or-nothing gate before anything is written or pushed. Also writes
      # the run header: every later step appends its own row in step order, so
      # the summary accumulates into one readable report.
      - name: Guard branch, input and token
        id: guard
        env:
          # The input and the actor are user-controlled: both reach the scripts
          # through the environment and are never interpolated into a run block.
          ACTOR: ${{ github.actor }}
          BUMP_INPUT: ${{ inputs.bump }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          BUMP_TOKEN: ${{ secrets.RELEASE_BUMP_TOKEN }}
        run: |
          set -e
          summary_row() { printf '%s\n' "$1" | scripts/ci/step-summary.sh || true; }

          {
            echo "## Bump version — \`$BUMP_INPUT\`"
            echo ''
            echo "- Ref: \`$REF_NAME\` ($REF_TYPE) · $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ''
          } | scripts/ci/step-summary.sh || true

          # The bump commit must land where `CI / checks` is actually posted:
          # ci.yml runs on pushes to `main` only, so a bump anywhere else would
          # wait out release.yml's 15-minute CI budget and fail.
          if [ "$REF_TYPE" != 'branch' ] || [ "$REF_NAME" != 'main' ]; then
            echo "::error::run this workflow on the main branch (current ref: $REF_NAME, type: $REF_TYPE) — ci.yml posts 'CI / checks' only for pushes to main"
            summary_row "- Guard: ❌ blocked (ref \`$REF_NAME\`, type \`$REF_TYPE\`; expected branch \`main\`)"
            exit 1
          fi

          # The run's entire purpose is commit + tag + push: without the PAT it
          # would go green having released nothing. The built-in GITHUB_TOKEN
          # cannot stand in — its pushes never trigger another workflow in
          # Forgejo — so a red run is the honest outcome here.
          if [ -z "$BUMP_TOKEN" ]; then
            echo "::error::RELEASE_BUMP_TOKEN is not set — add the org-level Forgejo PAT (repo content write) as a secret; the built-in token cannot be used because its pushes never trigger other workflows"
            summary_row "- Guard: ❌ blocked (\`RELEASE_BUMP_TOKEN\` is not set)"
            exit 1
          fi

          if [ -z "$BUMP_INPUT" ]; then
            echo "::error::the 'bump' input is empty — pass major, minor, patch or a concrete vX.Y.Z"
            summary_row "- Guard: ❌ blocked (empty \`bump\` input — workflow_dispatch inputs need a recent Forgejo)"
            exit 1
          fi

          # The actor becomes the commit author name and the email local-part:
          # sanitize it at the boundary instead of trusting a value that flows
          # into the shell and into `git config user.email`. LC_ALL=C keeps the
          # ranges ASCII-only — otherwise collation lets accented letters pass.
          if [ -z "$ACTOR" ] || ! ( LC_ALL=C; [[ "$ACTOR" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] ); then
            echo "::error::the run actor is empty or has unexpected characters ('$ACTOR') — cannot sign the bump commit with a valid identity"
            summary_row "- Guard: ❌ blocked (unusable actor \`$ACTOR\`)"
            exit 1
          fi

          echo "Bumping '$BUMP_INPUT' on $REF_NAME as $ACTOR"
          summary_row "- Guard: ✅ on \`main\`, input \`$BUMP_INPUT\`, actor \`$ACTOR\`, token present"

      # The bump commit and its DCO trailer must carry the DISPATCHING user's
      # identity, not a bot: `git commit -s` signs with the configured identity.
      # The real email is used only when the user publishes it; otherwise the
      # instance-resolvable noreply form is used, which Forgejo attributes back
      # to the account. A hidden email, a 404 (private profile) and a token
      # rejected on this non-repo endpoint all degrade to that same fallback, so
      # the step never blocks the bump.
      - name: Resolve identity and configure git
        id: identity
        env:
          ACTOR: ${{ github.actor }}
          # Forgejo's automatic token: enough to READ a public user profile. It
          # authenticates as the internal Actions user, not as the actor.
          API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -e
          summary_row() { printf '%s\n' "$1" | scripts/ci/step-summary.sh || true; }

          # Fallback first, so every failure path already holds a correct value:
          # Forgejo's NO_REPLY_ADDRESS default is `noreply.<domain>` (not
          # `users.noreply.<domain>`), and the server resolves it back to the
          # account on commit attribution. A port in SERVER_URL would give
          # `actor@noreply.host:3000` — git accepts it, Forgejo does not resolve
          # it (attribution degrades); the fixed instance URL has no port.
          LOWER_ACTOR=$(printf '%s' "$ACTOR" | tr '[:upper:]' '[:lower:]')
          HOST="${SERVER_URL#*://}"
          HOST="${HOST%%/*}"
          FALLBACK_EMAIL="${LOWER_ACTOR}@noreply.${HOST}"

          # Non-fatal by design: a hidden email answers with the noreply
          # placeholder (valid as-is), a private profile 404s, and the automatic
          # token may be refused here — all cases fall through to the fallback.
          EMAIL=$(curl -sS -m 10 -H "Authorization: token $API_TOKEN" \
            "$SERVER_URL/api/v1/users/$ACTOR" | jq -r '.email // empty' 2>/dev/null || true)

          # Only a single plausible address token is accepted: empty, no '@',
          # whitespace, quotes or newlines all mean "use the fallback".
          VALID=0
          case "$EMAIL" in
            *@*) VALID=1 ;;
          esac
          case "$EMAIL" in
            *[[:space:]]*|*'"'*|*"'"*) VALID=0 ;;
            # Defense-in-depth: `$`, backtick, `;`, `|`, `<`, `>` and `\` never
            # belong in an address — anything odd degrades to the fallback.
            *[\\\$\`\;\|\<\>]*) VALID=0 ;;
          esac

          USED_FALLBACK=0
          if [ "$VALID" -ne 1 ]; then
            EMAIL="$FALLBACK_EMAIL"
            USED_FALLBACK=1
            echo "::warning::could not resolve the real email via the user API — using the noreply fallback $FALLBACK_EMAIL"
          fi
          # The API's placeholder for a hidden email IS the fallback form.
          if [ "$EMAIL" = "$FALLBACK_EMAIL" ]; then
            USED_FALLBACK=1
          fi

          git config user.name "$ACTOR"
          git config user.email "$EMAIL"

          if [ "$USED_FALLBACK" -eq 1 ]; then
            summary_row "- Identity: ✅ \`$ACTOR\` <\`$EMAIL\`> (noreply fallback — real email hidden or API unavailable)"
          else
            summary_row "- Identity: ✅ \`$ACTOR\` <\`$EMAIL\`>"
          fi

      - name: Run bump-version
        id: bump
        env:
          BUMP_INPUT: ${{ inputs.bump }}
        run: |
          set -e
          summary_row() { printf '%s\n' "$1" | scripts/ci/step-summary.sh || true; }

          node scripts/bump-version.mjs "$BUMP_INPUT"

          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          summary_row "- Bump: ✅ v$VERSION — commit + tag created locally"

      # First push: without it the bump commit exists only on this runner, and
      # ci.yml (trigger `push: branches: [main]`) has nothing to check. The job
      # ends right after this step — the slot is released before job `tag`
      # starts waiting on CI.
      - name: Push the bump commit to main
        id: push-main
        env:
          BUMP_TOKEN: ${{ secrets.RELEASE_BUMP_TOKEN }}
        run: |
          summary_row() { printf '%s\n' "$1" | scripts/ci/step-summary.sh || true; }

          # No credentials in the remote URL: the token is served by this inline
          # helper (same mechanics as release.yml's Codeberg push), so it never
          # reaches git's echoed URLs or the logs.
          HELPER='!f() { test "$1" = get && printf "username=slovo-ci\npassword=%s\n" "$BUMP_TOKEN"; }; f'

          if git -c credential.helper="$HELPER" push origin main; then
            echo "Pushed the bump commit to main"
            # The bump commit SHA — job `tag` targets it. NOT github.sha, which
            # stays the pre-bump commit at dispatch time.
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            summary_row "- Push main: ✅ bump commit pushed, ci.yml triggered"
          else
            echo "::error::could not push the bump commit to main (non-fast-forward?) — most likely nothing was mutated; verify with 'git ls-remote origin main' against the runner's 'git rev-parse HEAD' before re-dispatching"
            summary_row "- Push main: ❌ rejected — most likely nothing mutated remotely; verify with \`git ls-remote origin main\` before re-dispatching"
            exit 1
          fi

  tag:
    needs: bump
    # Only when the bump actually landed on main; a red bump job is the signal.
    if: needs.bump.result == 'success'
    runs-on: ubuntu-24.04

    # The wait must not hold a runner slot indefinitely: 30 min covers the
    # 60×15s poll budget plus checkout; the default would be hours.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history + tags: the tag job re-creates the annotated tag on the
          # bump commit (`needs.bump.outputs.sha`), which must exist locally.
          fetch-depth: 0
          fetch-tags: true
          # Same rule as job `bump`: the automatic token must not shadow the
          # PAT push below.
          persist-credentials: false

      # Same mechanics and budget as release.yml's create-release: 60 x 15s.
      # Forgejo appends the triggering event to the context, e.g.
      # "CI / checks (push)", so match by prefix — the automatic contexts
      # (CI / dco, CI / remote, CI / local, CI / gate) never start with it.
      - name: Wait for CI on the bump commit
        id: wait-ci
        env:
          # The bump commit SHA from job `bump` — NOT github.sha, which is the
          # pre-bump commit at dispatch time.
          BUMP_SHA: ${{ needs.bump.outputs.sha }}
          # Reading statuses needs no push rights: the built-in token suffices.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          summary_row() { printf '%s\n' "$1" | scripts/ci/step-summary.sh || true; }

          HEAD_SHA="$BUMP_SHA"
          SHORT_SHA="${HEAD_SHA:0:7}"
          URL="${{ github.server_url }}/api/v1/repos/${{ github.repository }}/commits/$HEAD_SHA/status"

          {
            echo "## Bump version — tag"
            echo ''
            echo "- Commit: \`$SHORT_SHA\` · $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ''
          } | scripts/ci/step-summary.sh || true

          for i in $(seq 1 60); do
            # `[]?` + `|| true`: the first polls hit a commit that either has no
            # statuses yet (`.statuses: null`) or a body we cannot parse — that
            # must mean "keep waiting", not abort under `set -e`.
            STATE=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "$URL" | jq -r '.statuses[]? | select(.context | startswith("CI / checks")) | .status' 2>/dev/null | head -1 || true)

            case "$STATE" in
              success)
                echo "CI passed for $HEAD_SHA"
                echo "result=passed" >> "$GITHUB_OUTPUT"
                summary_row "- CI: ✅ \`CI / checks\` passed on \`$SHORT_SHA\` (attempt $i/60)"
                exit 0
                ;;
              failure|error)
                echo "::error::CI did not pass for $HEAD_SHA (status: $STATE) — refusing to tag this commit"
                echo "result=failed" >> "$GITHUB_OUTPUT"
                summary_row "- CI: ❌ $STATE on \`$SHORT_SHA\` — tag not pushed"
                exit 1
                ;;
              warning)
                # ci.yml posts `warning` for a superseded run (a newer push to
                # main cancelled it) — the bump commit was never actually
                # checked, so tag nothing; the newer run is the real verdict.
                echo "::error::CI status for $HEAD_SHA is 'warning' — the run was superseded by a newer push to main; verify the newer run goes green, then tag manually (git push origin v<version>) or re-dispatch"
                echo "result=warning" >> "$GITHUB_OUTPUT"
                summary_row "- CI: ⚠️ superseded on \`$SHORT_SHA\` — tag not pushed"
                exit 1
                ;;
            esac

            echo "Waiting for CI status on $HEAD_SHA (attempt $i/60)..."
            sleep 15
          done

          echo "::error::Timed out waiting for CI status on $HEAD_SHA — the tag was not pushed"
          echo "result=timeout" >> "$GITHUB_OUTPUT"
          summary_row "- CI: ❌ timed out on \`$SHORT_SHA\` — tag not pushed"
          exit 1

      # Job `bump`'s annotated tag died with its runner, so it is re-created
      # here on the exact bump commit (same content, same target). If the tag
      # is already on the remote, a previous attempt pushed it — nothing to do.
      - name: Push the tag
        id: push-tag
        env:
          VERSION: ${{ needs.bump.outputs.version }}
          BUMP_SHA: ${{ needs.bump.outputs.sha }}
          BUMP_TOKEN: ${{ secrets.RELEASE_BUMP_TOKEN }}
        run: |
          set -e
          summary_row() { printf '%s\n' "$1" | scripts/ci/step-summary.sh || true; }

          HELPER='!f() { test "$1" = get && printf "username=slovo-ci\npassword=%s\n" "$BUMP_TOKEN"; }; f'

          # ls-remote exits 2 when the ref is absent and non-zero on transport
          # errors; only exit 0 proves presence. Anything else falls through to
          # the push, which then fails loudly instead of skipping the release.
          if git -c credential.helper="$HELPER" ls-remote --exit-code origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::notice::tag v$VERSION is already on origin — nothing to push"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            summary_row "- Push tag: ⏭️ \`v$VERSION\` already on origin — nothing to push"
            exit 0
          fi

          git tag -a "v$VERSION" -m "v$VERSION" "$BUMP_SHA"

          if ! git -c credential.helper="$HELPER" push origin "v$VERSION"; then
            echo "::error::tag v$VERSION was not pushed — do NOT re-dispatch the same version (a second bump commit would be created); push the tag manually from a maintainer clone"
            summary_row "- Push tag: ❌ failed (\`v$VERSION\`) — do not re-dispatch; push it manually"
            exit 1
          fi
          summary_row "- Push tag: ✅ \`v$VERSION\` pushed, release.yml triggered"

          # Loud proof the push reached the server: the tag ref is visible in
          # ls-remote, not just created locally.
          if git -c credential.helper="$HELPER" ls-remote --exit-code origin "refs/tags/v$VERSION" >/dev/null; then
            echo "tag v$VERSION is present on origin"
            summary_row "- Remote tag: ✅ \`refs/tags/v$VERSION\` present on origin"
          else
            echo "::error::tag v$VERSION is missing on origin despite a successful push"
            summary_row "- Remote tag: ❌ \`refs/tags/v$VERSION\` missing on origin after push"
            exit 1
          fi

      # Footer: always runs, so the summary ends with a verdict even when a step
      # above failed and skipped the rest. Everything is read from the outcomes
      # the steps reported — an empty outcome means "did not run", never
      # success. Job `bump` has no footer: a red bump job is the signal itself.
      - name: Run summary
        id: run-summary
        if: always()
        env:
          VERSION: ${{ needs.bump.outputs.version }}
          WAIT_CI_RESULT: ${{ steps.wait-ci.outputs.result }}
          WAIT_CI_OUTCOME: ${{ steps.wait-ci.outcome }}
          TAG_SKIPPED: ${{ steps.push-tag.outputs.skipped }}
          PUSH_TAG_OUTCOME: ${{ steps.push-tag.outcome }}
        run: |
          summary_row() { printf '%s\n' "$1" | scripts/ci/step-summary.sh || true; }

          if [ "$WAIT_CI_RESULT" = 'failed' ] || [ "$WAIT_CI_RESULT" = 'warning' ]; then
            VERDICT="❌ failed at wait-ci — CI is red or superseded on the bump commit (see the step log); the tag for v$VERSION was NOT pushed. Fix main, then tag manually (git push origin v$VERSION) once CI is green."
          elif [ "$WAIT_CI_RESULT" = 'timeout' ]; then
            VERDICT="❌ failed at wait-ci — no CI status within 15 min; the tag for v$VERSION was NOT pushed (see the recovery notes in the header)"
          elif [ "$WAIT_CI_OUTCOME" != 'success' ]; then
            VERDICT="❌ failed at wait-ci — the status poll errored (see the log); the tag for v$VERSION was NOT pushed"
          elif [ "$TAG_SKIPPED" = 'true' ]; then
            VERDICT="⏭️ nothing to push — tag v$VERSION was already on origin; release.yml was triggered by that earlier push"
          elif [ "$PUSH_TAG_OUTCOME" != 'success' ]; then
            VERDICT="❌ failed at push-tag — the tag for v$VERSION was not pushed; push it manually (see the header)"
          else
            VERDICT="🎉 bumped v$VERSION — bump on main, CI green, tag pushed; release.yml is running and its CI wait passes instantly"
          fi

          {
            echo ''
            echo '---'
            echo ''
            echo "**Result:** $VERDICT"
          } | scripts/ci/step-summary.sh || true
