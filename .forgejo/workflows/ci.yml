name: CI

# NOTE: Forgejo Actions provides the `github.*` context for GitHub Actions
# compatibility. `workflow_run` is not supported by Forgejo Actions
# (https://codeberg.org/forgejo/forgejo/issues/6494), so dco -> checks
# ordering is enforced with `needs:` inside this single workflow instead
# of chaining across separate workflow files.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dco:
    runs-on: ubuntu-24.04
    # Tags point at commits already checked when they were pushed to main;
    # some Forgejo versions still dispatch this workflow for tag pushes
    # despite the `branches: [main]` filter, so guard explicitly.
    if: github.ref_type != 'tag'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: DCO Sign-off Check
        run: |
          set -e

          if [ -n "${{ github.event.pull_request }}" ]; then
            BASE_SHA=${{ github.event.pull_request.base.sha }}
            HEAD_SHA=${{ github.event.pull_request.head.sha }}
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git rev-list --max-parents=0 HEAD | tail -1)
            HEAD_SHA=${{ github.event.after }}
          else
            BASE_SHA=${{ github.event.before }}
            HEAD_SHA=${{ github.event.after }}
          fi

          # Get all non-merge commits in the PR range
          COMMITS=$(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          FAILED=0

          for COMMIT in $COMMITS; do
            # Extract author info from commit metadata
            AUTHOR_NAME=$(git show -s --format='%an' "$COMMIT")
            AUTHOR_EMAIL=$(git show -s --format='%ae' "$COMMIT")
            SHORT_SHA=$(git show -s --format='%h' "$COMMIT")
            SUBJECT=$(git show -s --format='%s' "$COMMIT")

            # Extract Signed-off-by trailers from commit body
            SOB_TRAILERS=$(git show -s --format='%b' "$COMMIT" | grep -i '^Signed-off-by:')

            # Check 1: Signed-off-by trailer must exist
            if [ -z "$SOB_TRAILERS" ]; then
              echo "::error::Commit $SHORT_SHA ($SUBJECT) is missing a Signed-off-by trailer"
              echo "  Author: $AUTHOR_NAME <$AUTHOR_EMAIL>"
              echo "  Fix with: git rebase --signoff HEAD~1"
              FAILED=1
              continue
            fi

            # Check 2: At least one Signed-off-by email must match commit author email
            MATCH_FOUND=0
            while IFS= read -r line; do
              # Extract email from "Signed-off-by: Name <email>"
              SOB_EMAIL=$(echo "$line" | sed -n 's/.*<\(.*\)>.*/\1/p')
              if [ "$SOB_EMAIL" = "$AUTHOR_EMAIL" ]; then
                MATCH_FOUND=1
                break
              fi
            done <<< "$SOB_TRAILERS"

            if [ "$MATCH_FOUND" -eq 0 ]; then
              echo "::error::Commit $SHORT_SHA ($SUBJECT) has Signed-off-by trailers, but none match the author email $AUTHOR_EMAIL"
              echo "  Found trailers: $SOB_TRAILERS"
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "DCO check failed. Each commit must include:"
            echo "  Signed-off-by: Your Name <your.email@example.com>"
            echo "Use 'git commit -s' to add the trailer automatically."
            echo "See https://developercertificate.org/ for details."
            exit 1
          fi

          echo "DCO check passed: all commits are properly signed off."

  checks:
    needs: dco
    runs-on: ubuntu-24.04

    # Both runner slots share one 4 GB host; heavy jobs must not overlap with
    # the release build. Same group as the `release` job in release.yml —
    # see its comment for the OOM (exit 137) context.
    concurrency:
      group: memory-heavy-jobs
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory
        id: yarn-cache-dir
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

      - name: Cache yarn dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check types (tsc)
        run: yarn check:types

      - name: Check FSD architecture (steiger)
        run: yarn check:fsd

      - name: Lint (ESLint)
        run: yarn lint

      - name: Run all tests (jest)
        # --maxWorkers=2 caps peak memory: heavy jest-expo + RN UI test suites
        # were triggering OOM (SIGKILL) when many workers ran in parallel.
        run: yarn testFinal --maxWorkers=2

      # Clean up large directories to reduce runner storage usage
      - name: Cleanup workspace
        if: always()
        run: |
          rm -rf node_modules .yarn/cache .expo jest-cache dist 2>/dev/null || true
          find . -name '*.tsbuildinfo' -type f -delete 2>/dev/null || true
          find . -name '.cache' -type d -delete 2>/dev/null || true
