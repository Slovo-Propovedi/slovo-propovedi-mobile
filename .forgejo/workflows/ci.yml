name: CI

on:
  # Chained after DCO for pushes to main (see dco.yml), so CI never runs
  # against a commit that failed the sign-off check. PRs still trigger CI
  # directly since workflow_run doesn't reliably chain across PR events.
  workflow_run:
    workflows: ['DCO']
    types: [completed]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory
        id: yarn-cache-dir
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

      - name: Cache yarn dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check types (tsc)
        run: yarn check:types

      - name: Check FSD architecture (steiger)
        run: yarn check:fsd

      - name: Lint (ESLint)
        run: yarn lint

      - name: Run all tests (jest)
        run: yarn testFinal

      # Clean up large directories to reduce runner storage usage
      - name: Cleanup workspace
        if: always()
        run: |
          rm -rf node_modules .yarn/cache .expo jest-cache dist 2>/dev/null || true
          find . -name '*.tsbuildinfo' -type f -delete 2>/dev/null || true
          find . -name '.cache' -type d -delete 2>/dev/null || true
