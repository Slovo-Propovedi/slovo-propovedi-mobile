name: CI

# NOTE: Forgejo Actions provides the `github.*` context for GitHub Actions
# compatibility. `workflow_run` is not supported by Forgejo Actions
# (https://codeberg.org/forgejo/forgejo/issues/6494), so job ordering is
# enforced with `needs:` inside this single workflow instead of chaining
# across separate workflow files.
#
# Heavy checks run on GitHub-hosted runners via scripts/ci/github-dispatch.sh
# (`remote`). When the dispatch cannot start a run (queue/infra timeout, exit
# 42) the `local` job runs the same ./actions/checks composite on the Forgejo
# runner. `gate` then posts the final `CI / checks` commit status — the
# automatic job contexts are `CI / dco`, `CI / remote`, `CI / local` and
# `CI / gate`; release.yml's create-release waits for the manual `CI / checks`
# entry. A real remote failure (exit 1) is NOT retried locally: it fails `gate`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dco:
    runs-on: ubuntu-24.04
    # Tags point at commits already checked when they were pushed to main;
    # some Forgejo versions still dispatch this workflow for tag pushes
    # despite the `branches: [main]` filter, so guard explicitly.
    if: github.ref_type != 'tag'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: DCO Sign-off Check
        run: |
          set -e

          if [ -n "${{ github.event.pull_request }}" ]; then
            BASE_SHA=${{ github.event.pull_request.base.sha }}
            HEAD_SHA=${{ github.event.pull_request.head.sha }}
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git rev-list --max-parents=0 HEAD | tail -1)
            HEAD_SHA=${{ github.event.after }}
          else
            BASE_SHA=${{ github.event.before }}
            HEAD_SHA=${{ github.event.after }}
          fi

          # Get all non-merge commits in the PR range
          COMMITS=$(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          FAILED=0
          TOTAL=0
          BAD_ROWS=""

          for COMMIT in $COMMITS; do
            TOTAL=$((TOTAL + 1))
            COMMIT_OK=1

            # Extract author info from commit metadata
            AUTHOR_NAME=$(git show -s --format='%an' "$COMMIT")
            AUTHOR_EMAIL=$(git show -s --format='%ae' "$COMMIT")
            SHORT_SHA=$(git show -s --format='%h' "$COMMIT")
            SUBJECT=$(git show -s --format='%s' "$COMMIT")

            # Extract Signed-off-by trailers from commit body. The `|| true` is
            # required: grep exits 1 when nothing matches and `set -e` would
            # abort the script here — before the offending commit is reported.
            SOB_TRAILERS=$(git show -s --format='%b' "$COMMIT" | grep -i '^Signed-off-by:' || true)

            # Check 1: Signed-off-by trailer must exist
            if [ -z "$SOB_TRAILERS" ]; then
              echo "::error::commit $SHORT_SHA: missing Signed-off-by trailer"
              echo "  Subject: $SUBJECT"
              echo "  Author: $AUTHOR_NAME <$AUTHOR_EMAIL>"
              echo "  Fix with: git rebase --signoff HEAD~1"
              FAILED=1
              COMMIT_OK=0
            fi

            # Check 2: At least one Signed-off-by email must match commit author email
            MATCH_FOUND=0
            while IFS= read -r line; do
              # Extract email from "Signed-off-by: Name <email>"
              SOB_EMAIL=$(printf '%s\n' "$line" | sed -n 's/.*<\(.*\)>.*/\1/p' || true)
              if [ "$SOB_EMAIL" = "$AUTHOR_EMAIL" ]; then
                MATCH_FOUND=1
                break
              fi
            done <<< "$SOB_TRAILERS"

            if [ "$MATCH_FOUND" -eq 0 ]; then
              echo "::error::commit $SHORT_SHA: no Signed-off-by email matches author $AUTHOR_EMAIL"
              echo "  Subject: $SUBJECT"
              if [ -n "$SOB_TRAILERS" ]; then
                echo "  Found trailers: $SOB_TRAILERS"
              else
                echo "  No Signed-off-by trailer found"
              fi
              FAILED=1
              COMMIT_OK=0
            fi

            if [ "$COMMIT_OK" -eq 0 ]; then
              AUTHOR_ESC=${AUTHOR_NAME//|/\\|}
              BAD_ROWS="${BAD_ROWS}| \`$SHORT_SHA\` | ${SUBJECT//|/\\|} | $AUTHOR_ESC <$AUTHOR_EMAIL> |"$'\n'
            fi
          done

          {
            echo "## DCO"
            echo ""
            if [ "$FAILED" -eq 1 ]; then
              echo "❌ $TOTAL commit(s) checked, some failed the sign-off check:"
              echo ""
              echo "| Commit | Subject | Author |"
              echo "|---|---|---|"
              printf '%s' "$BAD_ROWS"
              echo ""
              echo "Fix with \`git commit -s\` / \`git rebase --signoff HEAD~1\` (trailer email must match the commit author)."
            else
              echo "✅ $TOTAL commit(s) checked, all signed off."
            fi
          } | scripts/ci/step-summary.sh

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "DCO check failed. Each commit must include:"
            echo "  Signed-off-by: Your Name <your.email@example.com>"
            echo "Use 'git commit -s' to add the trailer automatically."
            echo "See https://developercertificate.org/ for details."
            exit 1
          fi

          echo "DCO check passed: all commits are properly signed off."

  remote:
    needs: dco
    # Tags point at commits already checked when they were pushed to main (same
    # guard as the dco job); some Forgejo versions dispatch this workflow for
    # tag pushes despite the `branches: [main]` filter.
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04

    outputs:
      fallback: ${{ steps.dispatch.outputs.fallback }}
      superseded: ${{ steps.dispatch.outputs.superseded }}
      run_url: ${{ steps.dispatch.outputs.run_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Dispatch checks to GitHub-hosted runners
        id: dispatch
        env:
          # Classic PAT (repo + workflow scopes); may be switched to
          # MIRROR_GITHUB_TOKEN if its scopes suffice — see
          # docs/features/ci-orchestration.md.
          GH_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
          # Automatic Forgejo token: posts the live `pending` CI status as soon
          # as the GitHub run is discovered (best-effort).
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GitHub org has hyphens, Forgejo org has underscores.
          GH_REPO: Slovo-Propovedi/slovo-propovedi-mobile
          WORKFLOW: ci.yml
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          # An unconfigured secret must not redden main: degrade to the local
          # fallback instead of failing the dispatch.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::CI_GITHUB_TOKEN is not configured — skipping GitHub dispatch, running locally"
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            echo "run_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          # stdout carries only the machine line `GH_RUN_URL=<url>`, printed
          # before the long poll; stderr stays attached so run progress streams
          # live into the job log.
          DISPATCH_OUT=$(mktemp)
          bash scripts/ci/github-dispatch.sh > "$DISPATCH_OUT" &
          DISPATCH_PID=$!

          pending_posted=false
          announce_run() {
            # Forgejo masks org-variable values (e.g. MOBILE_REPOSITORY_NAME)
            # inside URLs, which breaks the markdown href; percent-encoded
            # dashes decode to the same URL but no longer contain the masked
            # literal. The link text stays the raw run id.
            local summary_url="${RUN_URL//-/%2D}"
            {
              echo '## CI dispatched to GitHub-hosted runners'
              echo "- Run: [${RUN_URL##*/}](${summary_url}) — статус и логи в GitHub Actions"
            } | scripts/ci/step-summary.sh || true
            # A job summary is rendered only after the job completes, so the
            # run is also announced as a pending commit status: it shows up on
            # the commit page immediately, and the gate overwrites it with the
            # final verdict later.
            if [ "$pending_posted" != "true" ]; then
              pending_posted=true
              bash scripts/ci/forgejo-set-status.sh "${{ github.sha }}" pending "CI / checks" "$RUN_URL" \
                "Checks running on GitHub-hosted runners" \
                || echo "note: pending CI status was not posted (best-effort)"
            fi
          }

          # Publish the run link as soon as the dispatcher discovers the run: the
          # step returns only after the poll (up to RUN_TIMEOUT_MIN), so writing
          # the summary at the end would show the link far too late.
          RUN_URL=""
          for _ in $(seq 1 150); do
            RUN_URL=$(sed -n 's/^GH_RUN_URL=//p' "$DISPATCH_OUT" | tail -1)
            if [ -n "$RUN_URL" ]; then
              announce_run
              break
            fi
            kill -0 "$DISPATCH_PID" 2>/dev/null || break
            sleep 2
          done

          wait "$DISPATCH_PID"
          STATUS=$?
          OUTPUT=$(cat "$DISPATCH_OUT")
          rm -f "$DISPATCH_OUT"

          # Printed by the dispatcher on the 0/1/42/43 paths (see its header).
          # Covers a run discovered after the early-summary window (slow mirror).
          if [ -z "$RUN_URL" ]; then
            RUN_URL=$(printf '%s\n' "$OUTPUT" | sed -n 's/^GH_RUN_URL=//p' | tail -1)
            if [ -n "$RUN_URL" ]; then
              announce_run
            fi
          fi
          set -e

          case "$STATUS" in
            0)
              echo "fallback=false" >> "$GITHUB_OUTPUT"
              ;;
            42)
              echo "fallback=true" >> "$GITHUB_OUTPUT"
              echo "::warning::GitHub-hosted checks unavailable (queue/infra) — using the local fallback"
              ;;
            43)
              echo "fallback=false" >> "$GITHUB_OUTPUT"
              echo "superseded=true" >> "$GITHUB_OUTPUT"
              echo "::warning::GitHub run was cancelled externally (superseded by a newer push) — reporting warning, not failure"
              ;;
            *)
              echo "::error::GitHub-hosted checks failed (dispatch exit $STATUS)"
              exit "$STATUS"
              ;;
          esac

          echo "run_url=$RUN_URL" >> "$GITHUB_OUTPUT"

  local:
    needs: [dco, remote]
    if: always() && needs.remote.outputs.fallback == 'true'
    runs-on: ubuntu-24.04

    # Both runner slots share one 4 GB host; heavy jobs must not overlap with
    # the release build. Same group as the heavy `release.yml` jobs — see its
    # comment for the OOM (exit 137) context.
    concurrency:
      group: memory-heavy-jobs
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run repository checks (local fallback)
        uses: ./actions/checks
        with:
          profile: constrained

  gate:
    needs: [remote, local]
    # Tag pushes are already checked when they reached main (same guard as dco);
    # a status posted here would otherwise fail a release tag's CI lookup.
    if: always() && github.ref_type != 'tag'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Post CI verdict
        env:
          # Automatic Forgejo Actions token; if the status POST 403s, replace
          # with a repo secret holding a token with repo-write.
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REMOTE_RESULT: ${{ needs.remote.result }}
          LOCAL_RESULT: ${{ needs.local.result }}
          SUPERSEDED: ${{ needs.remote.outputs.superseded }}
          RUN_URL: ${{ needs.remote.outputs.run_url }}
        run: |
          status_emoji() {
            case "$1" in
              success) printf '✅' ;;
              failure) printf '❌' ;;
              cancelled) printf '🟨' ;;
              warning) printf '⚠️' ;;
              *) printf '⏭️' ;;
            esac
          }

          # A superseded run must never redden the old commit: the newer push
          # re-runs the checks and reports their result. A local pass always
          # wins (it can only run when the remote dispatch did not start one).
          if [ "${SUPERSEDED:-}" = "true" ] && [ "$LOCAL_RESULT" != "success" ]; then
            VERDICT=warning
            DESCRIPTION="Superseded by a newer push — checks re-run on the newer commit"
          elif [ "$LOCAL_RESULT" = "success" ]; then
            VERDICT=success
            DESCRIPTION="Local fallback (GitHub unavailable): checks passed"
          elif [ "$LOCAL_RESULT" = "skipped" ] && [ "$REMOTE_RESULT" = "success" ]; then
            VERDICT=success
            DESCRIPTION="GitHub-hosted checks passed"
          elif [ "$REMOTE_RESULT" = "skipped" ] && [ "$LOCAL_RESULT" = "skipped" ]; then
            VERDICT=failure
            DESCRIPTION="Blocked by DCO check"
          else
            VERDICT=failure
            DESCRIPTION="CI failed (remote: $REMOTE_RESULT, local: $LOCAL_RESULT)"
          fi

          # The dispatcher only emits a GitHub run URL on the 0/1/42/43 paths;
          # point the status at this workflow run otherwise. Keep the raw
          # dispatch URL separately: its absence means the remote never ran, and
          # the summary row must not pretend the Forgejo URL is a GitHub run.
          GH_RUN_URL="${RUN_URL:-}"
          if [ -z "$RUN_URL" ]; then
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

          bash scripts/ci/forgejo-set-status.sh \
            "${{ github.sha }}" "$VERDICT" "CI / checks" "$RUN_URL" "$DESCRIPTION"

          {
            echo '## CI'
            echo ''
            echo '| Stage | Result |'
            echo '|---|---|'
            echo "| remote (GitHub-hosted) | $(status_emoji "$REMOTE_RESULT") $REMOTE_RESULT |"
            echo "| local (Forgejo fallback) | $(status_emoji "$LOCAL_RESULT") $LOCAL_RESULT |"
            echo "| verdict | $(status_emoji "$VERDICT") $VERDICT |"
            if [ -n "$GH_RUN_URL" ]; then
              echo "| GitHub run | [${GH_RUN_URL##*/}](${GH_RUN_URL//-/%2D}) |"
            else
              echo '| GitHub run | — |'
            fi
            if [ "${SUPERSEDED:-}" = "true" ]; then
              echo ''
              echo 'Superseded by a newer push — checks re-run on the newer commit.'
            fi
          } | scripts/ci/step-summary.sh
