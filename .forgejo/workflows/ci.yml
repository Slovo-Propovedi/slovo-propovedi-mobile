name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check types (tsc)
        run: yarn check:types

      - name: Check FSD architecture (steiger)
        run: yarn check:fsd

      - name: Lint (ESLint)
        run: yarn lint

      - name: Run all tests (jest)
        run: yarn testFinal

      # Clean up large directories to reduce runner storage usage
      - name: Cleanup workspace
        if: always()
        run: |
          rm -rf node_modules .yarn/cache .expo jest-cache dist 2>/dev/null || true
          find . -name '*.tsbuildinfo' -type f -delete 2>/dev/null || true
          find . -name '.cache' -type d -delete 2>/dev/null || true
