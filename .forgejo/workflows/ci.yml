name: CI

# NOTE: Forgejo Actions provides the `github.*` context for GitHub Actions
# compatibility. `workflow_run` is not supported by Forgejo Actions
# (https://codeberg.org/forgejo/forgejo/issues/6494), so dco -> checks
# ordering is enforced with `needs:` inside this single workflow instead
# of chaining across separate workflow files.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dco:
    runs-on: ubuntu-24.04
    # Tags point at commits already checked when they were pushed to main;
    # some Forgejo versions still dispatch this workflow for tag pushes
    # despite the `branches: [main]` filter, so guard explicitly.
    if: github.ref_type != 'tag'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: DCO Sign-off Check
        run: |
          set -e

          if [ -n "${{ github.event.pull_request }}" ]; then
            BASE_SHA=${{ github.event.pull_request.base.sha }}
            HEAD_SHA=${{ github.event.pull_request.head.sha }}
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git rev-list --max-parents=0 HEAD | tail -1)
            HEAD_SHA=${{ github.event.after }}
          else
            BASE_SHA=${{ github.event.before }}
            HEAD_SHA=${{ github.event.after }}
          fi

          # Get all non-merge commits in the PR range
          COMMITS=$(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          FAILED=0
          TOTAL=0
          BAD_ROWS=""

          for COMMIT in $COMMITS; do
            TOTAL=$((TOTAL + 1))
            COMMIT_OK=1

            # Extract author info from commit metadata
            AUTHOR_NAME=$(git show -s --format='%an' "$COMMIT")
            AUTHOR_EMAIL=$(git show -s --format='%ae' "$COMMIT")
            SHORT_SHA=$(git show -s --format='%h' "$COMMIT")
            SUBJECT=$(git show -s --format='%s' "$COMMIT")

            # Extract Signed-off-by trailers from commit body. The `|| true` is
            # required: grep exits 1 when nothing matches and `set -e` would
            # abort the script here — before the offending commit is reported.
            SOB_TRAILERS=$(git show -s --format='%b' "$COMMIT" | grep -i '^Signed-off-by:' || true)

            # Check 1: Signed-off-by trailer must exist
            if [ -z "$SOB_TRAILERS" ]; then
              echo "::error::commit $SHORT_SHA: missing Signed-off-by trailer"
              echo "  Subject: $SUBJECT"
              echo "  Author: $AUTHOR_NAME <$AUTHOR_EMAIL>"
              echo "  Fix with: git rebase --signoff HEAD~1"
              FAILED=1
              COMMIT_OK=0
            fi

            # Check 2: At least one Signed-off-by email must match commit author email
            MATCH_FOUND=0
            while IFS= read -r line; do
              # Extract email from "Signed-off-by: Name <email>"
              SOB_EMAIL=$(printf '%s\n' "$line" | sed -n 's/.*<\(.*\)>.*/\1/p' || true)
              if [ "$SOB_EMAIL" = "$AUTHOR_EMAIL" ]; then
                MATCH_FOUND=1
                break
              fi
            done <<< "$SOB_TRAILERS"

            if [ "$MATCH_FOUND" -eq 0 ]; then
              echo "::error::commit $SHORT_SHA: no Signed-off-by email matches author $AUTHOR_EMAIL"
              echo "  Subject: $SUBJECT"
              if [ -n "$SOB_TRAILERS" ]; then
                echo "  Found trailers: $SOB_TRAILERS"
              else
                echo "  No Signed-off-by trailer found"
              fi
              FAILED=1
              COMMIT_OK=0
            fi

            if [ "$COMMIT_OK" -eq 0 ]; then
              AUTHOR_ESC=${AUTHOR_NAME//|/\\|}
              BAD_ROWS="${BAD_ROWS}| \`$SHORT_SHA\` | ${SUBJECT//|/\\|} | $AUTHOR_ESC <$AUTHOR_EMAIL> |"$'\n'
            fi
          done

          {
            echo "## DCO"
            echo ""
            if [ "$FAILED" -eq 1 ]; then
              echo "❌ $TOTAL commit(s) checked, some failed the sign-off check:"
              echo ""
              echo "| Commit | Subject | Author |"
              echo "|---|---|---|"
              printf '%s' "$BAD_ROWS"
              echo ""
              echo "Fix with \`git commit -s\` / \`git rebase --signoff HEAD~1\` (trailer email must match the commit author)."
            else
              echo "✅ $TOTAL commit(s) checked, all signed off."
            fi
          } | scripts/ci/step-summary.sh

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "DCO check failed. Each commit must include:"
            echo "  Signed-off-by: Your Name <your.email@example.com>"
            echo "Use 'git commit -s' to add the trailer automatically."
            echo "See https://developercertificate.org/ for details."
            exit 1
          fi

          echo "DCO check passed: all commits are properly signed off."

  checks:
    needs: dco
    runs-on: ubuntu-24.04

    # Both runner slots share one 4 GB host; heavy jobs must not overlap with
    # the release build. Same group as the `release` job in release.yml —
    # see its comment for the OOM (exit 137) context.
    concurrency:
      group: memory-heavy-jobs
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory
        id: yarn-cache-dir
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

      - name: Cache yarn dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check patch-package patches
        id: patches
        run: |
          start=$EPOCHSECONDS
          yarn check:patches
          echo "duration=$((EPOCHSECONDS-start))s" >> "$GITHUB_OUTPUT"

      - name: "Check types (tsc: app + service worker)"
        id: types
        run: |
          start=$EPOCHSECONDS
          yarn check:types
          echo "duration=$((EPOCHSECONDS-start))s" >> "$GITHUB_OUTPUT"

      - name: Check FSD architecture (steiger)
        id: fsd
        run: |
          start=$EPOCHSECONDS
          yarn check:fsd
          echo "duration=$((EPOCHSECONDS-start))s" >> "$GITHUB_OUTPUT"

      - name: Lint (ESLint)
        id: lint
        run: |
          start=$EPOCHSECONDS
          yarn lint
          echo "duration=$((EPOCHSECONDS-start))s" >> "$GITHUB_OUTPUT"

      - name: Cache Gradle dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Java JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Android SDK
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /opt/android-sdk
          # Version-pinned static key: the SDK content is fixed by the pinned
          # commandlinetools version in "Setup Android SDK". Bump this key
          # whenever the commandlinetools version (11076708) in that URL changes.
          key: ${{ runner.os }}-android-sdk-11076708

      - name: Setup Android SDK
        env:
          ANDROID_SDK_ROOT: /opt/android-sdk
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          # Skip download/unzip/mv when the SDK was restored from cache; `mv`
          # would otherwise fail because cmdline-tools/latest already exists.
          [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ] || (
            curl -sSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            rm cmdline-tools.zip
          )

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          # `yes` never exits on its own — it gets SIGPIPE once sdkmanager
          # stops reading, and Actions runs steps with `bash -o pipefail`,
          # so that expected SIGPIPE (141) would otherwise fail this step
          # even though sdkmanager itself succeeds.
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" > /dev/null

      - name: Run all tests (jest)
        id: jest
        # --maxWorkers=2 caps peak memory: heavy jest-expo + RN UI test suites
        # were triggering OOM (SIGKILL) when many workers ran in parallel.
        run: |
          start=$EPOCHSECONDS
          yarn testFinal --maxWorkers=2
          echo "duration=$((EPOCHSECONDS-start))s" >> "$GITHUB_OUTPUT"

      - name: Run native unit tests
        id: native-tests
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.internal.http.connectionTimeout=120000
            -Dorg.gradle.internal.http.socketTimeout=300000
        run: |
          start=$EPOCHSECONDS
          cd android
          ./gradlew :apk-installer:testDebugUnitTest :audio-effects:testDebugUnitTest --continue
          echo "duration=$((EPOCHSECONDS-start))s" >> "$GITHUB_OUTPUT"

      # Forgejo (>= v17.0 + runner >= 13.2) renders this Markdown above the job
      # logs; on older runners the file write is silently discarded.
      - name: Job summary
        if: always()
        run: |
          [ -f scripts/ci/step-summary.sh ] || exit 0
          status_emoji() {
            case "$1" in
              success) echo '✅' ;;
              failure) echo '❌' ;;
              *) echo '⏭️' ;;
            esac
          }
          {
            echo '## Checks'
            echo ''
            echo '| Check | Status | Duration |'
            echo '|---|---|---|'
            echo "| check:patches | $(status_emoji '${{ steps.patches.outcome }}') | ${{ steps.patches.outputs.duration || '—' }} |"
            echo "| check:types | $(status_emoji '${{ steps.types.outcome }}') | ${{ steps.types.outputs.duration || '—' }} |"
            echo "| check:fsd | $(status_emoji '${{ steps.fsd.outcome }}') | ${{ steps.fsd.outputs.duration || '—' }} |"
            echo "| lint | $(status_emoji '${{ steps.lint.outcome }}') | ${{ steps.lint.outputs.duration || '—' }} |"
            echo "| jest tests | $(status_emoji '${{ steps.jest.outcome }}') | ${{ steps.jest.outputs.duration || '—' }} |"
            echo "| native tests (gradle) | $(status_emoji '${{ steps.native-tests.outcome }}') | ${{ steps.native-tests.outputs.duration || '—' }} |"
          } | scripts/ci/step-summary.sh

      # Clean up large directories to reduce runner storage usage
      - name: Cleanup workspace
        if: always()
        run: |
          rm -rf node_modules .yarn/cache .expo jest-cache dist 2>/dev/null || true
          find . -name '*.tsbuildinfo' -type f -delete 2>/dev/null || true
          find . -name '.cache' -type d -delete 2>/dev/null || true
