name: Renovate

# Opens PRs to bump npm deps, the Dockerfile base image and the Forgejo Actions
# in .forgejo/workflows. Config lives in ../../renovate.json — the Expo SDK and
# React Native core are held for a manual `expo install --fix` upgrade, not
# auto-bumped.
#
# Renovate is run straight from npm (`npx renovate`) rather than via
# renovatebot/github-action, because this runner only resolves `uses:` refs
# against data.forgejo.org (which mirrors actions/* only).
#
# DCO: ci.yml requires a Signed-off-by trailer whose email matches the commit
# author on every PR commit. Both come from the org variable
# RENOVATE_GIT_AUTHOR: it sets the author, and `commitBody` in renovate.json
# templates the trailer from it (`Signed-off-by: {{{gitAuthor}}}`), so they
# always match and no email is hardcoded.
#
# Requires the org- or repo-level secret RENOVATE_TOKEN — a Forgejo PAT with
# scopes: write:repository, write:issue, read:user, read:organization.
# Optional: RENOVATE_GITHUB_COM_TOKEN (a github.com read-only PAT) to avoid
# github.com rate limits when Renovate fetches release notes. It is passed as
# the GITHUB_COM_TOKEN env var — Forgejo forbids secret names starting GITHUB_.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-24.04

    # Regenerating the yarn.lock for a ~2000-package RN tree is memory-heavy;
    # share the group with ci.yml / release.yml so it never overlaps a build
    # on the 4 GB host (see release.yml for the OOM context).
    concurrency:
      group: memory-heavy-jobs
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Run Renovate
        id: renovate
        run: |
          start=$EPOCHSECONDS
          npx --yes renovate
          echo "duration=$((EPOCHSECONDS-start))s" >> "$GITHUB_OUTPUT"
        env:
          RENOVATE_PLATFORM: forgejo
          RENOVATE_ENDPOINT: ${{ github.server_url }}/api/v1
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_AUTODISCOVER: "false"
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          # Org variable (e.g. "Renovate Bot <renovate@example.com>"); also the
          # source of the Signed-off-by trailer (renovate.json `commitBody`).
          RENOVATE_GIT_AUTHOR: ${{ vars.RENOVATE_GIT_AUTHOR }}
          GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_GITHUB_COM_TOKEN }}
          LOG_LEVEL: info

      # Forgejo (>= v17.0 + runner >= 13.2) renders this Markdown above the job
      # logs; on older runners the file write is silently discarded.
      - name: Job summary
        if: always()
        run: |
          [ -f scripts/ci/step-summary.sh ] || exit 0
          case "${{ steps.renovate.outcome }}" in
            success) STATUS='✅ success' ;;
            failure) STATUS='❌ failure' ;;
            *) STATUS='⏭️ skipped' ;;
          esac
          {
            echo '## Renovate'
            echo ''
            echo "- Repository: \`${{ github.repository }}\`"
            echo "- Event: \`${{ github.event_name }}\`"
            echo "- Result: $STATUS (${{ steps.renovate.outputs.duration || '—' }})"
          } | scripts/ci/step-summary.sh
