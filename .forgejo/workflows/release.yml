name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-24.04

    # Both runner slots share one 4 GB host. A CI job running concurrently with
    # this build starves it for memory (release OOM, exit 137). This group is
    # also declared on the `checks` job in ci.yml, so heavy jobs queue instead
    # of overlapping. Light jobs (dco) stay outside the group.
    concurrency:
      group: memory-heavy-jobs
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for CI to pass on this commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          URL="${{ github.server_url }}/api/v1/repos/${{ github.repository }}/commits/${{ github.sha }}/status"

          # Runner capacity is 2, so this job holding a runner slot while
          # polling no longer starves the CI workflow of a runner to run on.
          for i in $(seq 1 40); do
            # Forgejo appends the triggering event to the context, e.g.
            # "CI / checks (push)", so match by prefix rather than equality.
            STATE=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "$URL" | jq -r '.statuses[] | select(.context | startswith("CI / checks")) | .status' | head -1)

            case "$STATE" in
              success) echo "CI passed for ${{ github.sha }}"; exit 0 ;;
              failure|error) echo "::error::CI did not pass for ${{ github.sha }} (status: $STATE). Refusing to release."; exit 1 ;;
            esac

            echo "Waiting for CI status on ${{ github.sha }} (attempt $i/40)..."
            sleep 15
          done

          echo "::error::Timed out waiting for CI status on ${{ github.sha }}"
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory
        id: yarn-cache-dir
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

      - name: Cache yarn dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        env:
          ANDROID_SDK_ROOT: /opt/android-sdk
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          rm cmdline-tools.zip

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          # `yes` never exits on its own — it gets SIGPIPE once sdkmanager
          # stops reading, and Actions runs steps with `bash -o pipefail`,
          # so that expected SIGPIPE (141) would otherwise fail this step
          # even though sdkmanager itself succeeds.
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" > /dev/null

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Verify version matches tag
        id: version
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG_VERSION"
          EXPECTED_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          # Check package.json
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            echo "::error::Run 'node scripts/bump-version.mjs $TAG_VERSION' before committing"
            exit 1
          fi

          # Check app.json
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::app.json version ($APP_VERSION) does not match tag ($TAG_VERSION)"
            echo "::error::Run 'node scripts/bump-version.mjs $TAG_VERSION' before committing"
            exit 1
          fi

          # Check build.gradle
          GRADLE_VERSION_NAME=$(grep 'versionName' android/app/build.gradle | head -1 | sed 's/.*versionName "\([^"]*\)".*/\1/')
          GRADLE_VERSION_CODE=$(grep 'versionCode' android/app/build.gradle | head -1 | sed 's/.*versionCode \([0-9]*\).*/\1/')
          if [ "$GRADLE_VERSION_NAME" != "$TAG_VERSION" ]; then
            echo "::error::build.gradle versionName ($GRADLE_VERSION_NAME) does not match tag ($TAG_VERSION)"
            echo "::error::Run 'node scripts/bump-version.mjs $TAG_VERSION' before committing"
            exit 1
          fi
          if [ "$GRADLE_VERSION_CODE" != "$EXPECTED_CODE" ]; then
            echo "::error::build.gradle versionCode ($GRADLE_VERSION_CODE) does not match expected ($EXPECTED_CODE)"
            echo "::error::Run 'node scripts/bump-version.mjs $TAG_VERSION' before committing"
            exit 1
          fi

          echo "All versions match tag $TAG_VERSION (code: $EXPECTED_CODE)"
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$EXPECTED_CODE" >> "$GITHUB_OUTPUT"

      - name: Prebuild native code
        run: npx expo prebuild --platform android --clean

      - name: Configure Gradle for CI
        run: |
          # expo prebuild regenerates android/gradle.properties from its template
          # with default JVM args (512 MiB metaspace). 1536m heap + 768m metaspace
          # (~2.3 GB total) leaves enough RAM for the Metro node process in the
          # memory-limited CI container — see the Build APK step for the full memory budget.
          # In-process Kotlin compilation (below) raises daemon metaspace usage;
          # 768m is headroom — metaspace commits only what it actually uses.
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m/' android/gradle.properties
          # Trim ABIs to arm64-v8a only (drop armeabi-v7a, x86, x86_64).
          # x86/x86_64 are only for emulators; armeabi-v7a (32-bit) is dropped to
          # halve native-compilation memory/time peak — almost all Android devices
          # since ~2018 are arm64. The react-native-gradle-plugin reads this
          # property and applies it to ndk.abiFilters.
          sed -i 's/reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' android/gradle.properties
          # Compile Kotlin inside the Gradle JVM. The default strategy spawns a
          # separate Kotlin daemon that stays alive (holding RAM) while the JS
          # bundle task runs — in the memory-limited CI container that memory is
          # needed by node/Metro.
          # printf with a leading \n: if the prebuild template lacks a trailing
          # newline, a plain echo merges this property into the previous line
          # (corrupting it — e.g. jvmargs) and the property never takes effect.
          printf '\nkotlin.compiler.execution.strategy=in-process\n' >> android/gradle.properties
          # org.gradle.workers.max caps concurrent Gradle tasks (e.g. per-ABI
          # CMake tasks, multi-module Kotlin) — it does NOT cap ninja -j inside
          # a single CMake task: AGP derives ninja parallelism from the CPU core
          # count (verified: react-native-gradle-plugin has no ninja/workers
          # handling). Kept as cheap insurance; the actual fix for the
          # native-phase memcg OOM was raising the job-container limit (see
          # docs/decisions.md).
          printf '\norg.gradle.workers.max=2\n' >> android/gradle.properties

          # Fail fast: if a future Expo SDK changes the template lines above, the seds
          # silently no-op and the build OOMs again with misleading logs (exit 137).
          grep -q '^reactNativeArchitectures=arm64-v8a$' android/gradle.properties \
            || { echo '::error::reactNativeArchitectures override did not apply — sed pattern no longer matches the Expo template'; exit 1; }
          grep -q '^org.gradle.jvmargs=.*Xmx1536m.*MaxMetaspaceSize=768m' android/gradle.properties \
            || { echo '::error::gradle.properties jvmargs override did not apply — sed pattern no longer matches the Expo template'; exit 1; }
          grep -q '^kotlin.compiler.execution.strategy=in-process' android/gradle.properties \
            || { echo '::error::kotlin.compiler.execution.strategy append did not apply'; exit 1; }
          grep -q '^org.gradle.workers.max=2' android/gradle.properties \
            || { echo '::error::workers.max append did not apply'; exit 1; }

      - name: Check runner resources
        run: |
          df -h /
          free -h
          cat /sys/fs/cgroup/memory.max 2>/dev/null || true

      - name: Build APK
        env:
          # Memory budget on the memory-limited CI container (memcg; the limit
          # is managed in the act-runner config — see docs/decisions.md):
          #   OS/runner ~0.6 GB + Gradle JVM ~2.3 GB (Xmx1536m + 768m metaspace,
          #   in-process Kotlin — no separate Kotlin daemon; workers.max=2 caps
          #   concurrent Gradle tasks, not clang within one ABI) + node/Metro
          #   main capped at 1536 MB + 2 Metro workers ~0.5 GB. Single ABI
          #   (arm64-v8a) halves the native compile peak. Host swap was the
          #   safety net for peaks, but the job container cannot push past its
          #   memcg limit.
          # NODE_OPTIONS caps the Metro bundler's Node.js heap
          # (createBundleReleaseJsAndAssets spawns node) and applies to its
          # forked worker processes too. CI_METRO_MAX_WORKERS is read by
          # metro.config.js to cap transform workers (each holds ASTs in RAM).
          # Tuning: if node starts failing with "JavaScript heap out of memory"
          # (exit 134) instead of 137, bump NODE_OPTIONS to 1792; if OOM-kills
          # (exit 137) persist, set CI_METRO_MAX_WORKERS=1. These values are a
          # conservative floor now that the job-container limit is raised.
          NODE_OPTIONS: --max-old-space-size=1536
          CI_METRO_MAX_WORKERS: '2'
        run: |
          cd android
          free -h
          nice -n 19 ionice -c 3 ./gradlew assembleRelease --no-daemon -Dorg.gradle.parallel=false --init-script ../scripts/gradle/disable-lint-vital.gradle
          df -h /

      - name: Rename and zip APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          APK_DIR=$(dirname "$APK_PATH")
          VERSION="${{ steps.version.outputs.version }}"
          RENAMED="Slovo.Propovedi v${VERSION}.apk"
          cp "$APK_PATH" "$APK_DIR/$RENAMED"
          zip -j "slovo-propovedi-v${VERSION}.zip" "$APK_DIR/$RENAMED"

      - name: Extract changelog section
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v target="## [$VERSION]" '
            index($0, target) == 1 { found = 1; next }
            found && $0 ~ /^## \[/ { exit }
            found && $0 ~ /^\[.*\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-body.md

          if [ ! -s release-body.md ]; then
            echo "::error::No changelog section found for v$VERSION in CHANGELOG.md"
            echo "::error::Run 'node scripts/bump-version.mjs $VERSION' before tagging"
            exit 1
          fi

          echo "Extracted changelog section for v$VERSION ($(wc -l < release-body.md) lines)"

      - name: Create Forgejo Release and upload asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -n \
            --arg tag "${{ github.ref_name }}" \
            --arg name "${{ github.ref_name }}" \
            --arg body "$(cat release-body.md)" \
            '{tag_name: $tag, name: $name, body: $body}' > release.json
          RESPONSE=$(curl -s -X POST \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases" \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            --data @release.json)
          RELEASE_ID=$(echo "$RESPONSE" | jq -r .id)
          curl -s -X POST \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=slovo-propovedi-v${{ steps.version.outputs.version }}.zip" \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary @slovo-propovedi-v${{ steps.version.outputs.version }}.zip

      - name: Cleanup workspace
        if: always()
        run: |
          rm -rf node_modules .yarn/cache .expo jest-cache dist android/app/build 2>/dev/null || true
          find . -name '*.tsbuildinfo' -type f -delete 2>/dev/null || true
          find . -name '.cache' -type d -delete 2>/dev/null || true
