name: Release

on:
  push:
    tags:
      - 'v*'

# Two release modes, decided by the `changes` job from the diff against the
# previous tag:
#   native   — a native path changed (or no previous tag): any file under
#              android/, ios/, plugins/, modules/, or a change to yarn.lock,
#              app.config.ts, ota.config.ts. Version metadata ALONE does not
#              count — scripts/bump-version.mjs rewrites package.json, gradle
#              versionName/versionCode, the pbxproj MARKETING_VERSION/
#              CURRENT_PROJECT_VERSION and the android strings.xml
#              expo_runtime_version on every release, so those files are
#              judged by content (see the `changes` job); create-release then
#              re-checks each of them against the tag. Native builds the APK
#              (ZIP + SHA256SUMS), mirrors it to GitHub and Codeberg, and
#              attaches it to the Forgejo release.
#   JS-only  — only JS/TS/assets changed: deploy the web PWA and publish the
#              bundle to xprem (OTA). NO Forgejo release is created — the git
#              tag exists, but there is no release object.
#
# A Forgejo release therefore always means "a new APK is available on the
# landing". New users download the latest APK and silently catch up to the
# newest JS bundle via OTA on first launch, so a JS-only tag has nothing to
# publish for them.
#
# The web PWA is deployed on every tag, independent of native/JS-only. The web
# zip is attached to the release only in native mode (there is no release to
# attach it to otherwise).
#
# `changes` also guards RUNTIME_VERSION: a native diff without a bumped literal
# in ota.config.ts fails the pipeline (an OTA bundle built for an old runtime
# must never reach a new native build). Every job needs `changes`, so a failed
# guard blocks the whole release.
#
# Jobs:
#   changes         — detect native-vs-JS mode + RUNTIME_VERSION guard (light)
#   create-release  — needs: changes, native only — gate on CI, verify versions,
#                     cut the Forgejo Release (`publish-release` attaches assets)
#   build-remote    — needs: [changes, create-release], native only — the
#                     GitHub build starts only after the CI gate; dispatches
#                     `.github/workflows/release.yml` and downloads its
#                     `unsigned-apk/` artifact; sets fallback=true when GitHub
#                     cannot run it (queue/infra)
#   android-package — needs: [changes, build-remote], native only — sign the
#                     remote unsigned APK (or build locally on fallback), zip it
#                     with SHA256SUMS.txt into the `release-assets` artifact
#                     (30-day retention)
#   web-package     — needs: [changes, android-package] — builds the web PWA on
#                     the local runner; native tags run only after a successful
#                     APK sign and upload the web zip as the `web-assets`
#                     artifact
#   publish-release — needs: [create-release, android-package, web-package],
#                     native only — download `release-assets` + `web-assets`,
#                     attach them to the Forgejo release and mirror the full
#                     asset set to GitHub and Codeberg. Re-running this job alone
#                     re-publishes WITHOUT rebuilding.
#   ota             — needs: changes, JS-only — publish the OTA bundle to xprem
# `web-package` depends on `android-package` (needs: [changes, android-package]):
# in native mode it starts only after a successful APK sign, while JS-only tags
# run it with `android-package` skipped. The memory-heavy jobs
# (`android-package`, `web-package`, `ota`, and ci.yml's `local` fallback) share
# the `memory-heavy-jobs` concurrency group and queue on the 4 GB host instead
# of overlapping. `build-remote`, `create-release` and `publish-release` stay
# OUT of that group: they are light network jobs, and create-release waits for
# `CI / checks`, which is produced by jobs in the group — sharing it would
# deadlock.

jobs:
  changes:
    runs-on: ubuntu-24.04

    outputs:
      native: ${{ steps.detect.outputs.native }}
      rv_now: ${{ steps.detect.outputs.rv_now }}
      rv_prev: ${{ steps.detect.outputs.rv_prev }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history + tags: the previous tag is the diff base, and
          # RUNTIME_VERSION is read from two different commits.
          fetch-depth: 0
          fetch-tags: true

      - name: Detect release mode
        id: detect
        run: |
          set -e
          summary_row() { printf '%s\n' "$1" | scripts/ci/step-summary.sh; }

          {
            echo "## Release ${{ github.ref_name }} — changes"
            echo ''
          } | scripts/ci/step-summary.sh

          # Previous tag by creator date, excluding the tag being released.
          # `|| true`: grep exits 1 when nothing is left (first ever tag).
          PREV=$(git tag --sort=-creatordate | grep -v -x "${{ github.ref_name }}" | sed -n '1p' || true)

          # Native-vs-JS detection lives in scripts/ci/detect-native-changes.sh
          # — one implementation shared with ota-publish.yml. An empty PREV
          # means "no diff base": the script reports native, the safest default
          # (a JS-only publish would reach no installed build anyway).
          DETECT=$(scripts/ci/detect-native-changes.sh "$PREV" "${{ github.ref_name }}")
          NATIVE=$(printf '%s\n' "$DETECT" | sed -n 's/^native=//p')
          RV_NOW=$(printf '%s\n' "$DETECT" | sed -n 's/^rv_now=//p')
          RV_PREV=$(printf '%s\n' "$DETECT" | sed -n 's/^rv_prev=//p')

          if [ -n "$PREV" ]; then
            echo "Previous tag: $PREV"
          else
            echo "No previous tag found — treating this release as native"
          fi

          echo "RUNTIME_VERSION: current='$RV_NOW' previous='$RV_PREV'"
          echo "native=$NATIVE" >> "$GITHUB_OUTPUT"
          echo "rv_now=$RV_NOW" >> "$GITHUB_OUTPUT"
          echo "rv_prev=$RV_PREV" >> "$GITHUB_OUTPUT"
          if [ "$NATIVE" = "true" ]; then
            MODE=native
          else
            MODE=js-only
          fi
          summary_row "- Mode: \`$MODE\` · RUNTIME_VERSION \`$RV_PREV\` → \`$RV_NOW\`"

      - name: Guard RUNTIME_VERSION bump for native changes
        id: guard-native-version
        # Native paths changed but the runtime gate did not move: the APK would
        # carry a new native build under the old runtimeVersion, so a JS bundle
        # published later could land on an incompatible binary. Fail the release.
        if: steps.detect.outputs.native == 'true' && steps.detect.outputs.rv_now == steps.detect.outputs.rv_prev
        run: |
          echo "::error::Native paths changed but RUNTIME_VERSION (ota.config.ts) was not bumped — use yarn bump-version, it manages RUNTIME_VERSION automatically"
          printf '%s\n' "- RUNTIME_VERSION guard: ❌ native diff without a bump — release blocked" | scripts/ci/step-summary.sh
          exit 1

      - name: Guard RUNTIME_VERSION drift without native changes
        id: guard-runtime-drift
        # Mirror image of the guard above: a bumped runtime gate on a JS-only
        # diff means no released APK carries the new runtimeVersion, so an OTA
        # bundle for it would never reach an installed build. Both-empty
        # (pre-OTA history) and first-release cases stay permissive.
        if: steps.detect.outputs.native == 'false' && steps.detect.outputs.rv_now != steps.detect.outputs.rv_prev && steps.detect.outputs.rv_now != '' && steps.detect.outputs.rv_prev != ''
        run: |
          echo "::error::RUNTIME_VERSION changed but native code did not — an OTA for this runtime would never reach any APK. Revert the RUNTIME_VERSION bump, or ship a native release (yarn bump-version manages RUNTIME_VERSION automatically)."
          printf '%s\n' "- RUNTIME_VERSION guard: ❌ runtime bump without a native diff — release blocked" | scripts/ci/step-summary.sh
          exit 1

      # Footer: always runs, so the summary gets a verdict table even when a
      # step above failed. An empty outcome means the step never ran, not a pass.
      - name: Job summary
        if: always()
        env:
          DETECT_OUTCOME: ${{ steps.detect.outcome }}
          GUARD_NATIVE_VERSION_OUTCOME: ${{ steps.guard-native-version.outcome }}
          GUARD_RUNTIME_DRIFT_OUTCOME: ${{ steps.guard-runtime-drift.outcome }}
        run: |
          [ -f scripts/ci/step-summary.sh ] || exit 0
          status_emoji() {
            case "$1" in
              success) printf '✅' ;;
              failure) printf '❌' ;;
              cancelled) printf '🟨' ;;
              *) printf '⏭️' ;;
            esac
          }
          summary_row() { printf '| %s | %s |\n' "$1" "$(status_emoji "$2")"; }
          {
            echo ''
            echo '---'
            echo ''
            echo '| Step | Status |'
            echo '| --- | --- |'
            summary_row detect "$DETECT_OUTCOME"
            summary_row guard-native-version "$GUARD_NATIVE_VERSION_OUTCOME"
            summary_row guard-runtime-drift "$GUARD_RUNTIME_DRIFT_OUTCOME"
          } | scripts/ci/step-summary.sh || true

  create-release:
    # Native mode only: a JS-only tag is a git tag with no release object, so
    # the landing keeps pointing at the latest APK release.
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Wait for CI to pass on this commit
        id: wait-ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          summary_row() { printf '%s\n' "$1" | scripts/ci/step-summary.sh; }

          {
            echo "## Release ${{ github.ref_name }} — create-release"
            echo ''
          } | scripts/ci/step-summary.sh

          URL="${{ github.server_url }}/api/v1/repos/${{ github.repository }}/commits/${{ github.sha }}/status"

          # Runner capacity is 2, so this job holding a runner slot while
          # polling no longer starves the CI workflow of a runner to run on.
          # 60 x 15s = 15 min: CI / checks is posted by ci.yml's gate job only
          # after the GitHub-hosted run finished, and the GitHub queue can add
          # several minutes on top of the run itself. Only the manual
          # "CI / checks" entry matches (the automatic contexts are
          # CI / dco, CI / remote, CI / local, CI / gate; Forgejo may append the
          # event, e.g. "CI / checks (push)", hence the prefix match).
          for i in $(seq 1 60); do
            # Forgejo appends the triggering event to the context, e.g.
            # "CI / checks (push)", so match by prefix rather than equality.
            STATE=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "$URL" | jq -r '.statuses[] | select(.context | startswith("CI / checks")) | .status' | head -1)

            case "$STATE" in
              success) echo "CI passed for ${{ github.sha }}"; summary_row "- CI status on \`${{ github.sha }}\`: ✅ passed"; exit 0 ;;
              failure|error) echo "::error::CI did not pass for ${{ github.sha }} (status: $STATE). Refusing to release."; summary_row "- CI status on \`${{ github.sha }}\`: ❌ $STATE — refusing to release"; exit 1 ;;
            esac

            echo "Waiting for CI status on ${{ github.sha }} (attempt $i/60)..."
            sleep 15
          done

          echo "::error::Timed out waiting for CI status on ${{ github.sha }}"
          summary_row "- CI status on \`${{ github.sha }}\`: ❌ timed out"
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Verify version matches tag
        id: version
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG_VERSION"
          EXPECTED_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            echo "::error::Run 'node scripts/bump-version.mjs $TAG_VERSION' before committing"
            exit 1
          fi

          GRADLE_VERSION_NAME=$(grep 'versionName' android/app/build.gradle | head -1 | sed 's/.*versionName "\([^"]*\)".*/\1/')
          GRADLE_VERSION_CODE=$(grep 'versionCode' android/app/build.gradle | head -1 | sed 's/.*versionCode \([0-9]*\).*/\1/')
          if [ "$GRADLE_VERSION_NAME" != "$TAG_VERSION" ]; then
            echo "::error::build.gradle versionName ($GRADLE_VERSION_NAME) does not match tag ($TAG_VERSION)"
            echo "::error::Run 'node scripts/bump-version.mjs $TAG_VERSION' before committing"
            exit 1
          fi
          if [ "$GRADLE_VERSION_CODE" != "$EXPECTED_CODE" ]; then
            echo "::error::build.gradle versionCode ($GRADLE_VERSION_CODE) does not match expected ($EXPECTED_CODE)"
            echo "::error::Run 'node scripts/bump-version.mjs $TAG_VERSION' before committing"
            exit 1
          fi

          STRINGS_RT=$(grep 'expo_runtime_version' android/app/src/main/res/values/strings.xml | sed 's/.*<string name="expo_runtime_version">\([^<]*\)<\/string>.*/\1/')
          if [ "$STRINGS_RT" != "$TAG_VERSION" ]; then
            echo "::error::strings.xml expo_runtime_version ($STRINGS_RT) does not match tag ($TAG_VERSION)"
            echo "::error::Run 'node scripts/bump-version.mjs $TAG_VERSION' before committing"
            exit 1
          fi

          PLIST_RT=$(grep 'EXUpdatesRuntimeVersion' -A1 ios/SlovoPropovedi/Supporting/Expo.plist | sed -n 's/.*<string>\([^<]*\)<\/string>.*/\1/p')
          if [ "$PLIST_RT" != "$TAG_VERSION" ]; then
            echo "::error::Expo.plist EXUpdatesRuntimeVersion ($PLIST_RT) does not match tag ($TAG_VERSION)"
            echo "::error::Run 'node scripts/bump-version.mjs $TAG_VERSION' before committing"
            exit 1
          fi

          echo "All versions match tag $TAG_VERSION (code: $EXPECTED_CODE)"
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

          {
            echo "- Versions: package.json ✅ · gradle versionName ✅ · versionCode \`$EXPECTED_CODE\` ✅ · strings.xml runtime ✅ · Expo.plist runtime ✅"
          } | scripts/ci/step-summary.sh

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v target="## [$VERSION]" '
            index($0, target) == 1 { found = 1; next }
            found && $0 ~ /^## \[/ { exit }
            found && $0 ~ /^\[.*\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-body.md

          if [ ! -s release-body.md ]; then
            echo "::error::No changelog section found for v$VERSION in CHANGELOG.md"
            echo "::error::Run 'node scripts/bump-version.mjs $VERSION' before tagging"
            exit 1
          fi

          echo "Extracted changelog section for v$VERSION ($(wc -l < release-body.md) lines)"

          {
            echo "### Changelog excerpt"
            echo ''
            sed 's/^/> /' release-body.md
            echo ''
          } | scripts/ci/step-summary.sh

      - name: Create Forgejo Release
        id: create-release-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          summary_row() { printf '%s\n' "$1" | scripts/ci/step-summary.sh; }
          jq -n \
            --arg tag "${{ github.ref_name }}" \
            --arg name "${{ github.ref_name }}" \
            --arg body "$(cat release-body.md)" \
            '{tag_name: $tag, name: $name, body: $body}' > release.json

          HTTP_CODE=$(curl -s -o release-response.json -w "%{http_code}" -X POST \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases" \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            --data @release.json)

          # Forgejo answers 409 (body: "release already exists") when the tag
          # already has a release — a full pipeline re-run must not die here.
          # Same tolerance as the GitHub mirror's duplicate-asset handling.
          if [ "$HTTP_CODE" = "409" ] || { [ "$HTTP_CODE" -ge 400 ] && grep -qi 'already exists' release-response.json; }; then
            echo "::warning::Forgejo Release ${{ github.ref_name }} already exists — continuing"
            summary_row "- Forgejo release: [${{ github.ref_name }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}) ♻️ already exists"
            exit 0
          fi

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Failed to create Forgejo Release (HTTP $HTTP_CODE)"
            cat release-response.json
            exit 1
          fi
          echo "Created Forgejo Release ${{ github.ref_name }} (HTTP $HTTP_CODE)"
          summary_row "- Forgejo release: [${{ github.ref_name }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}) ✅"

      # Footer: always runs, so the summary gets a verdict table even when a
      # step above failed. An empty outcome means the step never ran, not a pass.
      - name: Job summary
        if: always()
        env:
          WAIT_CI_OUTCOME: ${{ steps.wait-ci.outcome }}
          VERSION_OUTCOME: ${{ steps.version.outcome }}
          CHANGELOG_OUTCOME: ${{ steps.changelog.outcome }}
          CREATE_RELEASE_API_OUTCOME: ${{ steps.create-release-api.outcome }}
        run: |
          [ -f scripts/ci/step-summary.sh ] || exit 0
          status_emoji() {
            case "$1" in
              success) printf '✅' ;;
              failure) printf '❌' ;;
              cancelled) printf '🟨' ;;
              *) printf '⏭️' ;;
            esac
          }
          summary_row() { printf '| %s | %s |\n' "$1" "$(status_emoji "$2")"; }
          {
            echo ''
            echo '---'
            echo ''
            echo '| Step | Status |'
            echo '| --- | --- |'
            summary_row wait-ci "$WAIT_CI_OUTCOME"
            summary_row version "$VERSION_OUTCOME"
            summary_row changelog "$CHANGELOG_OUTCOME"
            summary_row create-release-api "$CREATE_RELEASE_API_OUTCOME"
          } | scripts/ci/step-summary.sh || true

      - name: Cleanup
        if: always()
        run: rm -f release-body.md release.json release-response.json

  build-remote:
    # Light dispatcher: hands the native APK build to GitHub-hosted runners. It
    # is deliberately NOT in the memory-heavy-jobs group — the heavy local
    # fallbacks (android-package / web-package) hold the group instead.
    #
    # Strict sequence: native tags wait for the CI gate (create-release polls
    # `CI / checks`); js-only tags skip this job entirely (web is built locally).
    needs: [changes, create-release]
    # APK-only: web is built locally by web-package; js-only tags never contact
    # GitHub (create-release is native-only, so it is always 'success' here).
    if: "!cancelled() && needs.changes.result == 'success' && needs.changes.outputs.native == 'true' && needs.create-release.result == 'success'"
    runs-on: ubuntu-24.04

    outputs:
      fallback: ${{ steps.dispatch.outputs.fallback }}
      run_url: ${{ steps.dispatch.outputs.run_url }}
      apk_sha256: ${{ steps.dispatch.outputs.apk_sha256 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Dispatch build to GitHub-hosted runners
        id: dispatch
        env:
          # Classic PAT (repo + workflow scopes); may be switched to
          # MIRROR_GITHUB_TOKEN if its scopes suffice — see
          # docs/features/ci-orchestration.md.
          GH_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
          # GitHub org has hyphens, Forgejo org has underscores.
          GH_REPO: Slovo-Propovedi/slovo-propovedi-mobile
          WORKFLOW: release.yml
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          # Opt-in commit binding (tag/ref + run head_sha). Exit 44 hard-fails
          # the release intentionally: no local fallback for a moved mirror tag.
          VERIFY_REF: '1'
        run: |
          # An unconfigured secret must not fail the release dispatch: signal the
          # local fallback instead (uploads below are skipped when fallback=true).
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::CI_GITHUB_TOKEN is not configured — skipping GitHub dispatch, running locally"
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            echo "run_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          export DISPATCH_INPUTS='{"mode":"native"}'
          export ARTIFACTS="unsigned-apk=unsigned-apk"
          OUTPUT=$(bash scripts/ci/github-dispatch.sh)
          STATUS=$?
          set -e

          # Printed by the dispatcher on the 0/1/42 paths (see its header).
          RUN_URL=$(printf '%s\n' "$OUTPUT" | sed -n 's/^GH_RUN_URL=//p' | tail -1)
          # Emitted only on the dispatcher's success path. On fallback (42) this
          # stays empty and branch A hard-fails downstream by design.
          APK_SHA=$(printf '%s\n' "$OUTPUT" | sed -n 's/^GH_UNSIGNED_APK_SHA256=//p' | tail -1)

          # Exit 44 (mirror tag/ref does not resolve to SHA) intentionally falls
          # into the `*` branch: hard failure, never a local fallback.
          case "$STATUS" in
            0)
              echo "fallback=false" >> "$GITHUB_OUTPUT"
              ;;
            42)
              echo "fallback=true" >> "$GITHUB_OUTPUT"
              echo "::warning::GitHub-hosted build unavailable (queue/infra) — using the local fallback"
              ;;
            *)
              echo "::error::GitHub-hosted build failed (dispatch exit $STATUS)"
              exit "$STATUS"
              ;;
          esac

          echo "run_url=$RUN_URL" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA" >> "$GITHUB_OUTPUT"

      # Fallback builds produce their artifacts directly in the local jobs, so
      # nothing is uploaded here when fallback=true.
      - name: Upload unsigned APK from GitHub
        if: steps.dispatch.outputs.fallback != 'true'
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: unsigned-apk
          path: unsigned-apk/
          # The dispatcher guarantees unsigned-apk on its success path, so a
          # missing artifact is a hard error (the digest gate expects it).
          if-no-files-found: error
          retention-days: 30

  android-package:
    # Native mode only: JS-only releases keep the previous APK (same runtime)
    # and go out through the `ota` job instead.
    needs: [changes, build-remote]
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04

    concurrency:
      group: memory-heavy-jobs
      cancel-in-progress: false

    env:
      # Composite actions cannot read `vars`/`secrets`: the caller passes the
      # build/signing configuration as job env (consumed by ./actions/*).
      REMOTE_OK: ${{ needs.build-remote.outputs.fallback == 'false' }}
      BACKEND_API_HOSTNAME: ${{ vars.BACKEND_API_HOSTNAME }}
      LANDING_HOSTNAME: ${{ vars.LANDING_HOSTNAME }}
      WEB_HOSTNAME: ${{ vars.WEB_HOSTNAME }}
      MIRROR_CODEBERG_URL: ${{ vars.MIRROR_CODEBERG_URL }}
      MIRROR_GITHUB_URL: ${{ vars.MIRROR_GITHUB_URL }}
      MOBILE_REPOSITORY_NAME: ${{ vars.MOBILE_REPOSITORY_NAME }}
      APK_SIGNER_SHA256: ${{ vars.APK_SIGNER_SHA256 }}
      EXPO_PUBLIC_BACKEND_API_HOSTNAME: ${{ vars.BACKEND_API_HOSTNAME }}
      EXPO_PUBLIC_LANDING_HOSTNAME: ${{ vars.LANDING_HOSTNAME }}
      EXPO_PUBLIC_WEB_HOSTNAME: ${{ vars.WEB_HOSTNAME }}
      EXPO_PUBLIC_MIRROR_CODEBERG_URL: ${{ vars.MIRROR_CODEBERG_URL }}
      EXPO_PUBLIC_MIRROR_GITHUB_URL: ${{ vars.MIRROR_GITHUB_URL }}
      EXPO_PUBLIC_MOBILE_REPOSITORY_NAME: ${{ vars.MOBILE_REPOSITORY_NAME }}
      EXPO_PUBLIC_OTA_URL: ${{ vars.EXPO_PUBLIC_OTA_URL }}
      EXPO_PUBLIC_XPREM_APP_ID: ${{ vars.EXPO_PUBLIC_XPREM_APP_ID }}
      EXPO_PUBLIC_XPREM_CHANNEL_NAME: ${{ vars.EXPO_PUBLIC_XPREM_CHANNEL_NAME }}
      EXPO_PUBLIC_XPREM_BRANCH_NAME: ${{ vars.EXPO_PUBLIC_XPREM_BRANCH_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Fallback builds are cut from a complete clone (release tooling
          # expects the full tag set); the remote branch only signs an APK.
          fetch-depth: 0
          fetch-tags: true

      - name: Compute version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Branch A: the GitHub-hosted build produced the unsigned APK.
      - name: Download unsigned APK from GitHub
        id: download-unsigned
        if: env.REMOTE_OK == 'true'
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          name: unsigned-apk
          path: unsigned-apk/

      - name: Resolve unsigned APK path
        id: unsigned-apk
        if: env.REMOTE_OK == 'true'
        run: |
          APK_PATH=$(find unsigned-apk -name "*.apk" -print -quit)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No unsigned APK found in the downloaded artifact"
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Sign APK
        id: sign-apk
        if: env.REMOTE_OK == 'true'
        uses: ./actions/sign-android
        with:
          version: ${{ steps.version.outputs.version }}
          unsignedApkPath: ${{ steps.unsigned-apk.outputs.path }}
          # Branch A only: branch B builds locally from the trusted Forgejo
          # commit, so no GitHub digest exists or is needed.
          expectedSha256: ${{ needs.build-remote.outputs.apk_sha256 }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # Branch B: GitHub was unavailable — build and sign locally.
      - name: Build and sign APK (local fallback)
        id: build-apk
        if: env.REMOTE_OK != 'true'
        uses: ./actions/release-android
        with:
          profile: constrained
          signing: env
          version: ${{ steps.version.outputs.version }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload release artifacts
        id: upload-artifacts
        # Both branches write release-assets/ (sign-android / release-android).
        # Publishing lives in `publish-release`, so a failed upload can be
        # re-run without rebuilding; 30 days is the practical re-run window.
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 30

      # Footer: always runs, so the summary gets a verdict table even when a
      # step above failed. An empty outcome means the step never ran, not a pass.
      - name: Job summary
        if: always()
        env:
          VERSION_OUTCOME: ${{ steps.version.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download-unsigned.outcome }}
          RESOLVE_OUTCOME: ${{ steps.unsigned-apk.outcome }}
          SIGN_OUTCOME: ${{ steps.sign-apk.outcome }}
          BUILD_OUTCOME: ${{ steps.build-apk.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload-artifacts.outcome }}
          FALLBACK: ${{ needs.build-remote.outputs.fallback }}
        run: |
          [ -f scripts/ci/step-summary.sh ] || exit 0
          status_emoji() {
            case "$1" in
              success) printf '✅' ;;
              failure) printf '❌' ;;
              cancelled) printf '🟨' ;;
              *) printf '⏭️' ;;
            esac
          }
          summary_row() { printf '| %s | %s |\n' "$1" "$(status_emoji "$2")"; }
          {
            echo ''
            echo '---'
            echo ''
            echo '| Step | Status |'
            echo '| --- | --- |'
            summary_row version "$VERSION_OUTCOME"
            summary_row download-unsigned "$DOWNLOAD_OUTCOME"
            summary_row resolve-unsigned "$RESOLVE_OUTCOME"
            summary_row sign-apk "$SIGN_OUTCOME"
            summary_row local-build "$BUILD_OUTCOME"
            summary_row upload-artifacts "$UPLOAD_OUTCOME"
            echo ''
            echo "GitHub-hosted build fallback: \`$FALLBACK\`"
          } | scripts/ci/step-summary.sh || true

      - name: Cleanup workspace
        if: always()
        run: |
          rm -rf node_modules .yarn/cache .expo jest-cache dist android/app/build unsigned-apk 2>/dev/null || true
          find . -name '*.tsbuildinfo' -type f -delete 2>/dev/null || true
          find . -name '.cache' -type d -delete 2>/dev/null || true

  web-package:
    # Deploy runs on every tag, including JS-only (no release exists there).
    # The release-asset steps below are gated on native mode separately.
    needs: [changes, android-package]
    # Native tags: web image push / VPS deploy / release zip require a REAL
    # android success. A skipped android-package means the dispatcher hard-failed
    # (exit 44 moved mirror tag / 1 real failure / 43 superseded) and no APK was
    # produced, so web must not ship either. js-only tags have no android job at
    # all (skipped by the native gate), so they ship as before.
    if: "!cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.native != 'true' || needs.android-package.result == 'success')"
    runs-on: ubuntu-24.04

    concurrency:
      group: memory-heavy-jobs
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Fail fast: all prod hostnames must come from Forgejo org/repo vars.
      # Without this a missing var would silently build the app with an empty
      # EXPO_PUBLIC_* value (or fail much later, mid-build).
      - name: Validate required vars
        env:
          BACKEND_API_HOSTNAME: ${{ vars.BACKEND_API_HOSTNAME }}
          LANDING_HOSTNAME: ${{ vars.LANDING_HOSTNAME }}
          WEB_HOSTNAME: ${{ vars.WEB_HOSTNAME }}
          MIRROR_CODEBERG_URL: ${{ vars.MIRROR_CODEBERG_URL }}
          MIRROR_GITHUB_URL: ${{ vars.MIRROR_GITHUB_URL }}
          MOBILE_REPOSITORY_NAME: ${{ vars.MOBILE_REPOSITORY_NAME }}
          # Registry push token — releases always push the images to the
          # registry, so the push token is required; validate it here.
          PACKAGE_REGISTRY_TOKEN: ${{ secrets.PACKAGE_REGISTRY_TOKEN }}
        run: |
          set -e

          {
            echo "## Release ${{ github.ref_name }} — web"
            echo ''
          } | scripts/ci/step-summary.sh

          missing=0
          missing_list=""
          for v in BACKEND_API_HOSTNAME LANDING_HOSTNAME WEB_HOSTNAME MIRROR_CODEBERG_URL MIRROR_GITHUB_URL MOBILE_REPOSITORY_NAME PACKAGE_REGISTRY_TOKEN; do
            if [ -z "${!v}" ]; then
              echo "::error::Required Forgejo variable $v is not set (org- or repo-level vars) — refusing to build"
              missing=1
              missing_list="$missing_list \`$v\`"
            fi
          done
          if [ "$missing" -eq 1 ]; then
            printf '%s\n' "- Required vars: ❌ missing$missing_list" | scripts/ci/step-summary.sh
          else
            printf '%s\n' "- Required vars: ✅" | scripts/ci/step-summary.sh
          fi
          exit $missing

      - name: Export web build
        id: web-export
        uses: ./actions/release-web
        with:
          profile: constrained
        env:
          # Inlined into the web bundle by Metro; the composite reads env only.
          EXPO_PUBLIC_BACKEND_API_HOSTNAME: ${{ vars.BACKEND_API_HOSTNAME }}
          EXPO_PUBLIC_LANDING_HOSTNAME: ${{ vars.LANDING_HOSTNAME }}
          EXPO_PUBLIC_WEB_HOSTNAME: ${{ vars.WEB_HOSTNAME }}
          EXPO_PUBLIC_MIRROR_CODEBERG_URL: ${{ vars.MIRROR_CODEBERG_URL }}
          EXPO_PUBLIC_MIRROR_GITHUB_URL: ${{ vars.MIRROR_GITHUB_URL }}
          EXPO_PUBLIC_MOBILE_REPOSITORY_NAME: ${{ vars.MOBILE_REPOSITORY_NAME }}

      - name: Check deploy config
        id: deploycfg
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          WEB_HOSTNAME: ${{ vars.WEB_HOSTNAME }}
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$WEB_HOSTNAME" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::VPS_HOST secret or WEB_HOSTNAME variable not set — skipping VPS deploy"
            printf '%s\n' "- VPS deploy: ⏭️ skipped (VPS_HOST secret or WEB_HOSTNAME variable not set)" | scripts/ci/step-summary.sh
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH
        id: ssh-setup
        if: steps.deploycfg.outputs.deploy == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          # The VPS host key is pinned from the org secret VPS_SSH_KNOWN_HOSTS
          # (`ssh-keyscan <VPS_HOST>` output, captured once and verified against
          # the server). A per-run ssh-keyscan on a fresh runner would trust
          # whatever key answers, i.e. offer no MITM protection.
          if [ -z "$VPS_SSH_KNOWN_HOSTS" ]; then
            echo "::error::VPS_SSH_KNOWN_HOSTS is not set — add the pinned VPS host key as a Forgejo org secret."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # Applies to every ssh/scp call in this job: an unknown or changed
          # host key aborts instead of being accepted.
          printf 'StrictHostKeyChecking yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Build and push web image to the registry
        if: steps.deploycfg.outputs.deploy == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          PACKAGE_REGISTRY_TOKEN: ${{ secrets.PACKAGE_REGISTRY_TOKEN }}
          REPOSITORY_URL: ${{ github.server_url }}
          BUILDX_BUILDER: ${{ vars.BUILDX_BUILDER }}
          DEPLOY_TAG: ${{ github.ref_name }}
          REGISTRY_USER: ${{ github.repository_owner }}
        run: |
          set -e
          # Docker CLI + buildx are not part of the runner image: install
          # pinned static builds into the job (no daemon — the CLI talks to the
          # VPS daemon over SSH via DOCKER_HOST).
          DOCKER_CLI_VERSION=27.5.1
          BUILDX_VERSION=0.20.1
          mkdir -p "$HOME/.docker-cli"
          curl -fsSL "https://download.docker.com/linux/static/stable/x86_64/docker-${DOCKER_CLI_VERSION}.tgz" \
            | tar xz -C "$HOME/.docker-cli" --strip-components=1 docker/docker
          curl -fsSL -o "$HOME/.docker-cli/docker-buildx" \
            "https://github.com/docker/buildx/releases/download/v${BUILDX_VERSION}/buildx-v${BUILDX_VERSION}.linux-amd64"
          chmod +x "$HOME/.docker-cli/docker-buildx"
          export PATH="$HOME/.docker-cli:$PATH"

          REGISTRY_HOST="${REPOSITORY_URL#https://}"
          # Image names must be lowercase: owner/repo come from the runner's
          # GITHUB_REPOSITORY env lowercased whole (${var,,}), so no org is
          # hardcoded and the ref always matches this repo's Packages tab
          # auto-link (Forgejo matches owner/repo case-insensitively).
          REGISTRY_IMAGE="${REPOSITORY_URL#*://}/${GITHUB_REPOSITORY,,}"
          IMAGE_REF="${REGISTRY_IMAGE}/web"
          echo "IMAGE_REF=$IMAGE_REF" >> "$GITHUB_ENV"

          # Login writes only to this job's docker config; buildx forwards the
          # credentials to the remote builder for the push. Never printed.
          printf '%s' "$PACKAGE_REGISTRY_TOKEN" \
            | docker login "$REGISTRY_HOST" --username "$REGISTRY_USER" --password-stdin

          export DOCKER_HOST="ssh://$VPS_SSH_USER@$VPS_HOST"
          # Builder records live in THIS client's local store (~/.docker/buildx),
          # not on the daemon: a fresh job has no record of the host's
          # pre-provisioned $BUILDX_BUILDER (playbook role `slovo-buildx`), so
          # `--builder` would fail with "no builder found" even though its
          # buildkit container runs on the VPS. Adopt the builder idempotently
          # while the job's local record is missing (buildx 0.20 semantics,
          # verified against the release source):
          #   - container already present on the daemon -> `create` just saves
          #     the local record and `--bootstrap` only probes the RUNNING
          #     container (start on a running container is a no-op, nothing is
          #     restarted) — its layer cache stays intact;
          #   - container absent (first release / host rebuilt) -> recreated
          #     with the EXACT `slovo-buildx` role parameters, so a CI-created
          #     builder matches the playbook one;
          #   - parallel jobs racing the same first create -> buildx treats a
          #     container-name conflict ("already in use") as adopt-and-wait,
          #     so the loser ends up on the winner's container.
          if ! docker buildx inspect "$BUILDX_BUILDER" >/dev/null 2>&1; then
            docker buildx create \
              --name "$BUILDX_BUILDER" \
              --driver docker-container \
              --driver-opt "memory=1g" \
              --driver-opt "cpu-quota=80000" \
              --bootstrap >/dev/null
          fi
          # Single-platform linux/amd64 like the former on-VPS build — the 4 GB
          # host gets no multi-arch builds. The dist/ export produced above is
          # shipped by buildx as the build context, so no tar over SSH.
          docker buildx build \
            --builder "$BUILDX_BUILDER" \
            --platform linux/amd64 \
            --push \
            --tag "$IMAGE_REF:$DEPLOY_TAG" \
            --tag "$IMAGE_REF:latest" \
            --build-arg OCI_IMAGE_SOURCE="${REPOSITORY_URL}/${GITHUB_REPOSITORY}" \
            .

      - name: Deploy to VPS
        id: deploy-vps
        if: steps.deploycfg.outputs.deploy == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          WEB_HOSTNAME: ${{ vars.WEB_HOSTNAME }}
          # Shared infra names (org vars mirroring the playbook).
          TRAEFIK_NETWORK: ${{ vars.TRAEFIK_NETWORK }}
          TRAEFIK_SERVICE: ${{ vars.TRAEFIK_SERVICE }}
          BUILDX_BUILDER: ${{ vars.BUILDX_BUILDER }}
          DEPLOY_TAG: ${{ github.ref_name }}
        run: |
          SSH_TARGET="${VPS_SSH_USER:-root}@$VPS_HOST"
          if [ -z "${IMAGE_REF:-}" ]; then
            echo "::error::IMAGE_REF is not set — the registry build step must export it"
            exit 1
          fi
          # Every value is shell-quoted for the remote shell (printf %q): a quote
          # in a ref name or variable can never break out of its argument.
          REMOTE_ENV="$(printf 'DEPLOY_TAG=%q IMAGE_REF=%q WEB_HOSTNAME=%q TRAEFIK_NETWORK=%q TRAEFIK_SERVICE=%q BUILDX_BUILDER=%q' \
            "$DEPLOY_TAG" "$IMAGE_REF" "$WEB_HOSTNAME" "$TRAEFIK_NETWORK" "$TRAEFIK_SERVICE" "$BUILDX_BUILDER")"
          # The image was built and pushed in the previous step; the deploy only
          # pulls it — nothing but the script itself crosses the SSH session.
          scp scripts/vps-deploy-web.sh "$SSH_TARGET:/tmp/vps-deploy-web.sh"
          ssh "$SSH_TARGET" \
            "chmod +x /tmp/vps-deploy-web.sh && $REMOTE_ENV bash /tmp/vps-deploy-web.sh"
          printf '%s\n' "- VPS deploy: ✅ https://$WEB_HOSTNAME (tag $DEPLOY_TAG)" | scripts/ci/step-summary.sh

      # Native mode only: the zip is published as the `web-assets` artifact and
      # attached to the release by publish-release with the APK assets, so the
      # GitHub/Codeberg mirrors always carry the full asset set. No release
      # dependency here (create-release runs in parallel).
      - name: Zip web build
        id: zip-web
        if: needs.changes.outputs.native == 'true'
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          (cd dist && zip -qr "../slovo-propovedi-web-v${VERSION}.zip" .)
          {
            echo "- Artifact: \`slovo-propovedi-web-v${VERSION}.zip\` ($(du -h "slovo-propovedi-web-v${VERSION}.zip" | cut -f1))"
          } | scripts/ci/step-summary.sh

      - name: Upload web zip artifact
        id: upload-web
        if: needs.changes.outputs.native == 'true'
        # Attached to the release in publish-release with the APK assets, so
        # the GitHub/Codeberg mirrors include it too.
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: web-assets
          # zip-web writes the archive to the workspace root (../ from dist/).
          path: slovo-propovedi-web-v*.zip
          if-no-files-found: error
          retention-days: 30

      # Footer: always runs, so the summary gets a verdict table even when a
      # step above failed. An empty outcome means the step never ran, not a pass.
      - name: Job summary
        if: always()
        env:
          ANDROID_OUTCOME: ${{ needs.android-package.result }}
          WEB_EXPORT_OUTCOME: ${{ steps.web-export.outcome }}
          DEPLOYCFG_OUTCOME: ${{ steps.deploycfg.outcome }}
          SSH_SETUP_OUTCOME: ${{ steps.ssh-setup.outcome }}
          DEPLOY_VPS_OUTCOME: ${{ steps.deploy-vps.outcome }}
          ZIP_WEB_OUTCOME: ${{ steps.zip-web.outcome }}
          UPLOAD_WEB_OUTCOME: ${{ steps.upload-web.outcome }}
        run: |
          [ -f scripts/ci/step-summary.sh ] || exit 0
          status_emoji() {
            case "$1" in
              success) printf '✅' ;;
              failure) printf '❌' ;;
              cancelled) printf '🟨' ;;
              *) printf '⏭️' ;;
            esac
          }
          summary_row() { printf '| %s | %s |\n' "$1" "$(status_emoji "$2")"; }
          {
            echo ''
            echo '---'
            echo ''
            echo '| Step | Status |'
            echo '| --- | --- |'
            summary_row android-package "$ANDROID_OUTCOME"
            summary_row web-export "$WEB_EXPORT_OUTCOME"
            summary_row deploycfg "$DEPLOYCFG_OUTCOME"
            summary_row ssh-setup "$SSH_SETUP_OUTCOME"
            summary_row deploy-vps "$DEPLOY_VPS_OUTCOME"
            summary_row zip-web "$ZIP_WEB_OUTCOME"
            summary_row upload-web "$UPLOAD_WEB_OUTCOME"
          } | scripts/ci/step-summary.sh || true

      - name: Cleanup workspace
        if: always()
        run: |
          rm -rf node_modules .yarn/cache .expo dist ~/.ssh/id_ed25519 2>/dev/null || true
          find . -name '*.tsbuildinfo' -type f -delete 2>/dev/null || true

  publish-release:
    # Native mode only: every dependency is native-gated, so a JS-only tag
    # skips this job too. Split out of the build job so a failed attach/mirror
    # can be re-run (re-run failed jobs) from the retained artifacts — no
    # rebuild. The web zip is attached here with the APK assets, so the
    # GitHub/Codeberg mirrors always carry the full asset set.
    needs: [create-release, android-package, web-package]
    runs-on: ubuntu-24.04

    # Deliberately NOT in the `memory-heavy-jobs` concurrency group: this job
    # only downloads an artifact and calls HTTP APIs (no Gradle/Metro), so it
    # must not queue behind the 4 GB build host.
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history + all tags: the Codeberg mirror step pushes
          # refs/remotes/origin/main and every local tag to Codeberg itself
          # (the scheduled git mirror lags behind the tag push), so a shallow
          # single-ref clone is not enough.
          fetch-depth: 0
          fetch-tags: true

      - name: Extract changelog section
        id: changelog
        run: |
          {
            echo "## Release ${{ github.ref_name }} — publish-release"
            echo ''
          } | scripts/ci/step-summary.sh

          VERSION="${{ needs.create-release.outputs.version }}"
          awk -v target="## [$VERSION]" '
            index($0, target) == 1 { found = 1; next }
            found && $0 ~ /^## \[/ { exit }
            found && $0 ~ /^\[.*\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-body.md

      - name: Download release artifacts
        id: download-artifacts
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          name: release-assets
          path: release-assets

      - name: Download web zip
        id: download-web
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          name: web-assets
          path: web-assets

      - name: Upload APK and web assets to the Forgejo Release
        id: upload-apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          summary_row() { printf '%s\n' "$1" | scripts/ci/step-summary.sh; }
          VERSION="${{ needs.create-release.outputs.version }}"
          TAG="${{ github.ref_name }}"
          RELEASE_JSON=/tmp/fo-release-assets.json
          curl -s \
            -H "Authorization: token $GITHUB_TOKEN" \
            -o "$RELEASE_JSON" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/tags/$TAG"
          RELEASE_ID=$(jq -r '.id // empty' "$RELEASE_JSON" 2>/dev/null || true)
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "::error::Could not resolve Forgejo release id for $TAG"
            exit 1
          fi

          # Forgejo does not dedupe attachment names, so a re-run must skip
          # assets that are already attached (GitHub handles 422, Codeberg
          # checks names itself).
          asset_exists() {
            jq -e --arg name "$1" '[.assets[]? | select(.name == $name)] | length > 0' "$RELEASE_JSON" >/dev/null
          }

          upload_asset() { # <name> <path> <content-type>
            local name=$1 path=$2 content_type=$3
            if asset_exists "$name"; then
              echo "::warning::$name already attached to the release — skipping"
              return 0
            fi
            curl -s -X POST \
              "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$name" \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: $content_type" \
              --data-binary @"$path"
          }

          upload_asset "slovo-propovedi-v${VERSION}.zip" "release-assets/slovo-propovedi-v${VERSION}.zip" "application/zip"
          upload_asset "SHA256SUMS.txt" "release-assets/SHA256SUMS.txt" "text/plain"
          upload_asset "slovo-propovedi-web-v${VERSION}.zip" "web-assets/slovo-propovedi-web-v${VERSION}.zip" "application/zip"
          summary_row "- Uploaded to the release: ✅ [$TAG](${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG)"

      - name: Mirror release to GitHub
        id: mirror-github
        env:
          # Forgejo reserves GITHUB_-prefixed names for its own env vars/secrets,
          # so both the secret and the env var use the MIRROR_GITHUB_TOKEN name.
          MIRROR_GITHUB_TOKEN: ${{ secrets.MIRROR_GITHUB_TOKEN }}
          # Mirror coordinates — org variables shared with the landing.
          MIRROR_GITHUB_URL: ${{ vars.MIRROR_GITHUB_URL }}
          MOBILE_REPOSITORY_NAME: ${{ vars.MOBILE_REPOSITORY_NAME }}
        run: |
          summary_row() { printf '%s\n' "$1" | scripts/ci/step-summary.sh; }
          if [ -z "${MIRROR_GITHUB_TOKEN:-}" ]; then
            echo "MIRROR_GITHUB_TOKEN is not configured - skipping GitHub mirror"
            summary_row "- GitHub mirror: ⏭️ skipped (MIRROR_GITHUB_TOKEN not set)"
            exit 0
          fi

          TAG="${{ github.ref_name }}"
          VERSION="${{ needs.create-release.outputs.version }}"
          ZIP_FILE="slovo-propovedi-v${VERSION}.zip"
          ZIP_PATH="release-assets/$ZIP_FILE"
          if [ -z "${MIRROR_GITHUB_URL:-}" ] || [ -z "${MOBILE_REPOSITORY_NAME:-}" ]; then
            echo "::warning::MIRROR_GITHUB_URL / MOBILE_REPOSITORY_NAME org variables are not set - skipping GitHub mirror"
            summary_row "- GitHub mirror: ⚠️ skipped (MIRROR_GITHUB_URL / MOBILE_REPOSITORY_NAME not set)"
            exit 0
          fi
          # The URL carries the owner as its only path segment (hosts and the
          # api.github.com base are fixed), so a host or owner rename is a
          # variable change, not a workflow change.
          GITHUB_OWNER="${MIRROR_GITHUB_URL%/}"
          GITHUB_OWNER="${GITHUB_OWNER##*/}"
          API_BASE="https://api.github.com/repos/$GITHUB_OWNER/$MOBILE_REPOSITORY_NAME"
          UPLOAD_BASE="https://uploads.github.com/repos/$GITHUB_OWNER/$MOBILE_REPOSITORY_NAME"
          AUTH_HEADER="Authorization: Bearer ${MIRROR_GITHUB_TOKEN}"
          ACCEPT_HEADER="Accept: application/vnd.github+json"
          API_VERSION_HEADER="X-GitHub-Api-Version: 2022-11-28"

          # The repo is git-mirrored, so the tag should already exist on GitHub.
          # If the tag push has not landed yet, release creation fails below and
          # the step degrades to a warning - the Forgejo release is already out.
          RELEASE_STATUS=$(curl -s -o /tmp/gh-release.json -w "%{http_code}" \
            -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" -H "$API_VERSION_HEADER" \
            "$API_BASE/releases/tags/$TAG" || true)

          if [ "$RELEASE_STATUS" = "200" ]; then
            RELEASE_ID=$(jq -r .id /tmp/gh-release.json 2>/dev/null || echo null)
            if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
              echo "::warning::GitHub mirror failed: could not read release id for $TAG"
              summary_row "- GitHub mirror: ⚠️ failed (could not read release id)"
              exit 0
            fi
            echo "GitHub release for $TAG already exists (id: $RELEASE_ID)"
            summary_row "- GitHub mirror: ✅ release already exists"
          elif [ "$RELEASE_STATUS" = "404" ]; then
            jq -n \
              --arg tag "$TAG" \
              --arg name "$TAG" \
              --arg body "$(cat release-body.md)" \
              '{tag_name: $tag, name: $name, body: $body}' > /tmp/gh-release-body.json
            CREATE_RESPONSE=$(curl -s -X POST \
              -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" -H "$API_VERSION_HEADER" \
              -H "Content-Type: application/json" \
              --data @/tmp/gh-release-body.json \
              "$API_BASE/releases" || true)
            RELEASE_ID=$(echo "$CREATE_RESPONSE" | jq -r .id 2>/dev/null || true)
            if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
              echo "::warning::GitHub mirror failed: could not create release for $TAG - $(echo "$CREATE_RESPONSE" | jq -r .message 2>/dev/null || true)"
              summary_row "- GitHub mirror: ⚠️ failed (could not create release)"
              exit 0
            fi
            echo "Created GitHub release for $TAG (id: $RELEASE_ID)"
            summary_row "- GitHub mirror: ✅ release created"
          else
            echo "::warning::GitHub mirror failed: unexpected status $RELEASE_STATUS for releases/tags/$TAG"
            summary_row "- GitHub mirror: ⚠️ failed (status $RELEASE_STATUS)"
            exit 0
          fi

          # 422 means the asset name is already taken - treat as success.
          UPLOAD_STATUS=$(curl -s -o /tmp/gh-upload.json -w "%{http_code}" -X POST \
            -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" -H "$API_VERSION_HEADER" \
            -H "Content-Type: application/zip" \
            --data-binary @"$ZIP_PATH" \
            "$UPLOAD_BASE/releases/$RELEASE_ID/assets?name=$ZIP_FILE" || true)

          if [ "$UPLOAD_STATUS" = "201" ]; then
            echo "Uploaded $ZIP_FILE to GitHub release $RELEASE_ID"
            summary_row "- GitHub mirror: ✅ asset uploaded"
          elif [ "$UPLOAD_STATUS" = "422" ]; then
            echo "Asset $ZIP_FILE already exists on GitHub release $RELEASE_ID - skipping"
            summary_row "- GitHub mirror: ✅ asset already exists"
          else
            echo "::warning::GitHub mirror failed: asset upload returned status $UPLOAD_STATUS - $(jq -r .message /tmp/gh-upload.json 2>/dev/null || true)"
            summary_row "- GitHub mirror: ⚠️ failed (asset status $UPLOAD_STATUS)"
          fi

          # Checksum asset rides alongside the zip (422 = already uploaded).
          SUMS_UPLOAD_STATUS=$(curl -s -o /tmp/gh-sums-upload.json -w "%{http_code}" -X POST \
            -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" -H "$API_VERSION_HEADER" \
            -H "Content-Type: text/plain" \
            --data-binary @release-assets/SHA256SUMS.txt \
            "$UPLOAD_BASE/releases/$RELEASE_ID/assets?name=SHA256SUMS.txt" || true)

          if [ "$SUMS_UPLOAD_STATUS" = "201" ] || [ "$SUMS_UPLOAD_STATUS" = "422" ]; then
            echo "SHA256SUMS.txt is attached to GitHub release $RELEASE_ID (status $SUMS_UPLOAD_STATUS)"
          else
            echo "::warning::GitHub mirror failed: checksum upload returned status $SUMS_UPLOAD_STATUS - $(jq -r .message /tmp/gh-sums-upload.json 2>/dev/null || true)"
            summary_row "- GitHub mirror: ⚠️ failed (checksum status $SUMS_UPLOAD_STATUS)"
          fi

          # Web bundle rides in the same mirror release (422 = already there).
          WEB_ZIP_FILE="slovo-propovedi-web-v${VERSION}.zip"
          WEB_UPLOAD_STATUS=$(curl -s -o /tmp/gh-web-upload.json -w "%{http_code}" -X POST \
            -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" -H "$API_VERSION_HEADER" \
            -H "Content-Type: application/zip" \
            --data-binary @"web-assets/$WEB_ZIP_FILE" \
            "$UPLOAD_BASE/releases/$RELEASE_ID/assets?name=$WEB_ZIP_FILE" || true)

          if [ "$WEB_UPLOAD_STATUS" = "201" ]; then
            echo "Uploaded $WEB_ZIP_FILE to GitHub release $RELEASE_ID"
            summary_row "- GitHub mirror: ✅ web asset uploaded"
          elif [ "$WEB_UPLOAD_STATUS" = "422" ]; then
            echo "Asset $WEB_ZIP_FILE already exists on GitHub release $RELEASE_ID - skipping"
            summary_row "- GitHub mirror: ✅ web asset already exists"
          else
            echo "::warning::GitHub mirror failed: web asset upload returned status $WEB_UPLOAD_STATUS - $(jq -r .message /tmp/gh-web-upload.json 2>/dev/null || true)"
            summary_row "- GitHub mirror: ⚠️ failed (web asset status $WEB_UPLOAD_STATUS)"
          fi

      - name: Mirror release to Codeberg
        id: mirror-codeberg
        env:
          # Codeberg runs Forgejo, so auth uses the `token` scheme - NOT the
          # `Bearer` scheme the GitHub step needs.
          MIRROR_CODEBERG_TOKEN: ${{ secrets.MIRROR_CODEBERG_TOKEN }}
          # Mirror coordinates — org variables shared with the landing.
          MIRROR_CODEBERG_URL: ${{ vars.MIRROR_CODEBERG_URL }}
          MOBILE_REPOSITORY_NAME: ${{ vars.MOBILE_REPOSITORY_NAME }}
        run: |
          summary_row() { printf '%s\n' "$1" | scripts/ci/step-summary.sh; }
          if [ -z "${MIRROR_CODEBERG_TOKEN:-}" ]; then
            echo "MIRROR_CODEBERG_TOKEN is not configured - skipping Codeberg mirror"
            summary_row "- Codeberg mirror: ⏭️ skipped (MIRROR_CODEBERG_TOKEN not set)"
            exit 0
          fi

          TAG="${{ github.ref_name }}"
          VERSION="${{ needs.create-release.outputs.version }}"
          ZIP_FILE="slovo-propovedi-v${VERSION}.zip"
          ZIP_PATH="release-assets/$ZIP_FILE"
          WEB_ZIP_FILE="slovo-propovedi-web-v${VERSION}.zip"
          WEB_ZIP_PATH="web-assets/$WEB_ZIP_FILE"
          if [ -z "${MIRROR_CODEBERG_URL:-}" ] || [ -z "${MOBILE_REPOSITORY_NAME:-}" ]; then
            echo "::warning::MIRROR_CODEBERG_URL / MOBILE_REPOSITORY_NAME org variables are not set - skipping"
            summary_row "- Codeberg: ⚠️ skipped (MIRROR_CODEBERG_* / MOBILE_REPOSITORY_NAME not set)"
            exit 0
          fi
          # The URL carries the owner as its only path segment; Forgejo's API
          # lives OUTSIDE the owner path, so derive origin and owner from the
          # single URL — a host or owner rename is a variable change.
          CODEBERG_ORIGIN="${MIRROR_CODEBERG_URL%/*}"
          CODEBERG_ORG="${MIRROR_CODEBERG_URL%/}"
          CODEBERG_ORG="${CODEBERG_ORG##*/}"
          [ -n "$CODEBERG_ORIGIN" ] || {
            echo "::warning::CODEBERG_ORIGIN empty — MIRROR_CODEBERG_URL='${MIRROR_CODEBERG_URL:-}'"
            summary_row "- Codeberg mirror: ⚠️ skipped (cannot derive API origin)"
            exit 0
          }
          API_BASE="$CODEBERG_ORIGIN/api/v1/repos/$CODEBERG_ORG/$MOBILE_REPOSITORY_NAME"
          AUTH_HEADER="Authorization: token ${MIRROR_CODEBERG_TOKEN}"

          # The scheduled git mirror to Codeberg lags behind the tag push (at
          # release time the tag - and often its commit - may not exist there
          # yet), so this step pushes the refs itself instead of waiting for the
          # mirror. Sequence in the 404 branch (release not created yet):
          #   1. push main + all tags to Codeberg (force - mirror semantics:
          #      the Codeberg repo is a read-only public mirror);
          #   2. create the release WITHOUT target_commitish - the tag exists by
          #      then, so Forgejo attaches the release to it;
          #   3. upload the assets (unchanged).
          # If the push fails the step degrades to a warning - the Forgejo
          # release (source of truth) is already out.
          RELEASE_STATUS=$(curl -s -o /tmp/cb-release.json -w "%{http_code}" \
            -H "$AUTH_HEADER" \
            "$API_BASE/releases/tags/$TAG" || true)

          UPLOAD_ZIP=true
          UPLOAD_SUMS=true
          UPLOAD_WEB=true

          if [ "$RELEASE_STATUS" = "200" ]; then
            RELEASE_ID=$(jq -r .id /tmp/cb-release.json 2>/dev/null || echo null)
            if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
              echo "::warning::Codeberg mirror failed: could not read release id for $TAG"
              summary_row "- Codeberg mirror: ⚠️ failed (could not read release id)"
              exit 0
            fi
            # Forgejo does not reject duplicate attachment names, so the existing
            # assets are the dedup mechanism: upload only what is missing.
            ZIP_EXISTS=$(jq -r --arg n "$ZIP_FILE" '[.assets[]? | select(.name == $n)] | length > 0' /tmp/cb-release.json 2>/dev/null || echo false)
            SUMS_EXISTS=$(jq -r --arg n "SHA256SUMS.txt" '[.assets[]? | select(.name == $n)] | length > 0' /tmp/cb-release.json 2>/dev/null || echo false)
            WEB_EXISTS=$(jq -r --arg n "$WEB_ZIP_FILE" '[.assets[]? | select(.name == $n)] | length > 0' /tmp/cb-release.json 2>/dev/null || echo false)
            if [ "$ZIP_EXISTS" = "true" ]; then UPLOAD_ZIP=false; fi
            if [ "$SUMS_EXISTS" = "true" ]; then UPLOAD_SUMS=false; fi
            if [ "$WEB_EXISTS" = "true" ]; then UPLOAD_WEB=false; fi
            if [ "$UPLOAD_ZIP" = "false" ] && [ "$UPLOAD_SUMS" = "false" ] && [ "$UPLOAD_WEB" = "false" ]; then
              echo "Assets already attached to Codeberg release $TAG - skipping upload"
              summary_row "- Codeberg mirror: ✅ asset already attached"
              exit 0
            fi
            echo "Codeberg release for $TAG already exists (id: $RELEASE_ID)"
            summary_row "- Codeberg mirror: ✅ release already exists"
          elif [ "$RELEASE_STATUS" = "404" ]; then
            # Push the refs ourselves: the git mirror is scheduled and lags, so
            # waiting for it timed out repeatedly. No credentials in the remote
            # URL - the token is served by the inline credential helper below,
            # so it never reaches git's echoed URLs or the logs.
            git remote remove codeberg 2>/dev/null || true
            git remote add codeberg "$CODEBERG_ORIGIN/$CODEBERG_ORG/$MOBILE_REPOSITORY_NAME.git"

            # Force is intentional: Codeberg is a read-only public mirror, so
            # its main and tags must follow Forgejo exactly. The helper only
            # answers the credential request of this single codeberg push.
            # Codeberg/Gitea intermittently answers large HTTP/2 pushes with
            # 504 + "send-pack: unexpected disconnect" while the pack HAS been
            # processed server-side (the trailing "Everything up-to-date").
            # Force HTTP/1.1 (known Gitea workaround), retry, and verify the
            # tag via ls-remote before declaring failure — a 504 after
            # server-side processing must not skip release creation.
            PUSH_OK=""
            for ATTEMPT in 1 2 3; do
              if git -c http.version=HTTP/1.1 -c credential.helper='!f() { test "$1" = get && printf "username=mirror\npassword=%s\n" "$MIRROR_CODEBERG_TOKEN"; }; f' push codeberg "+refs/remotes/origin/main:refs/heads/main" "+refs/tags/*:refs/tags/*"; then
                PUSH_OK=1
                break
              fi
              # Anonymous on purpose: Codeberg is a public read-only mirror
              # (see the comment above), so its refs are world-readable.
              if git ls-remote --exit-code codeberg "refs/tags/$TAG" >/dev/null 2>&1; then
                echo "tag $TAG already present on Codeberg despite push error (504 after server-side processing) - continuing"
                PUSH_OK=1
                break
              fi
              if [ "$ATTEMPT" -lt 3 ]; then
                echo "push attempt $ATTEMPT failed; retrying in 15s"
                sleep 15
              fi
            done
            if [ -z "$PUSH_OK" ]; then
              echo "::warning::Codeberg mirror failed: git push to Codeberg failed — check that MIRROR_CODEBERG_TOKEN may write to the repo, that the Codeberg repo exists, and whether its history diverged from Forgejo"
              summary_row "- Codeberg mirror: ⚠️ failed (git push)"
              exit 0
            fi
            summary_row "- Codeberg mirror: ✅ git refs pushed (main + tags)"

            jq -n \
              --arg tag "$TAG" \
              --arg name "$TAG" \
              --arg body "$(cat release-body.md)" \
              '{tag_name: $tag, name: $name, body: $body}' > /tmp/cb-release-body.json
            CREATE_STATUS=$(curl -s -o /tmp/cb-create.json -w "%{http_code}" -X POST \
              -H "$AUTH_HEADER" -H "Content-Type: application/json" \
              --data @/tmp/cb-release-body.json \
              "$API_BASE/releases" || true)
            RELEASE_ID=$(jq -r .id /tmp/cb-create.json 2>/dev/null || echo null)
            if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
              echo "::warning::Codeberg mirror failed: could not create release for $TAG (status $CREATE_STATUS) - $(jq -r .message /tmp/cb-create.json 2>/dev/null || true)"
              summary_row "- Codeberg mirror: ⚠️ failed (create release, status $CREATE_STATUS)"
              exit 0
            fi
            echo "Created Codeberg release for $TAG (id: $RELEASE_ID)"
            summary_row "- Codeberg mirror: ✅ release created"
          else
            echo "::warning::Codeberg mirror failed: unexpected status $RELEASE_STATUS for $API_BASE/releases/tags/$TAG"
            summary_row "- Codeberg mirror: ⚠️ failed (status $RELEASE_STATUS)"
            exit 0
          fi

          if [ "$UPLOAD_ZIP" = "true" ]; then
            # Raw body upload: the ?name= query param is mandatory in this mode.
            UPLOAD_STATUS=$(curl -s -o /tmp/cb-upload.json -w "%{http_code}" -X POST \
              -H "$AUTH_HEADER" -H "Content-Type: application/zip" \
              --data-binary @"$ZIP_PATH" \
              "$API_BASE/releases/$RELEASE_ID/assets?name=$ZIP_FILE" || true)

            if [ "$UPLOAD_STATUS" = "201" ]; then
              echo "Uploaded $ZIP_FILE to Codeberg release $RELEASE_ID"
              summary_row "- Codeberg mirror: ✅ asset uploaded"
            else
              echo "::warning::Codeberg mirror failed: asset upload returned status $UPLOAD_STATUS - $(jq -r .message /tmp/cb-upload.json 2>/dev/null || true)"
              summary_row "- Codeberg mirror: ⚠️ failed (asset upload status $UPLOAD_STATUS)"
            fi
          fi

          if [ "$UPLOAD_SUMS" = "true" ]; then
            SUMS_UPLOAD_STATUS=$(curl -s -o /tmp/cb-sums-upload.json -w "%{http_code}" -X POST \
              -H "$AUTH_HEADER" -H "Content-Type: text/plain" \
              --data-binary @release-assets/SHA256SUMS.txt \
              "$API_BASE/releases/$RELEASE_ID/assets?name=SHA256SUMS.txt" || true)

            if [ "$SUMS_UPLOAD_STATUS" = "201" ]; then
              echo "Uploaded SHA256SUMS.txt to Codeberg release $RELEASE_ID"
              summary_row "- Codeberg mirror: ✅ checksum uploaded"
            else
              echo "::warning::Codeberg mirror failed: checksum upload returned status $SUMS_UPLOAD_STATUS - $(jq -r .message /tmp/cb-sums-upload.json 2>/dev/null || true)"
              summary_row "- Codeberg mirror: ⚠️ failed (checksum upload status $SUMS_UPLOAD_STATUS)"
            fi
          fi

          if [ "$UPLOAD_WEB" = "true" ]; then
            WEB_UPLOAD_STATUS=$(curl -s -o /tmp/cb-web-upload.json -w "%{http_code}" -X POST \
              -H "$AUTH_HEADER" -H "Content-Type: application/zip" \
              --data-binary @"$WEB_ZIP_PATH" \
              "$API_BASE/releases/$RELEASE_ID/assets?name=$WEB_ZIP_FILE" || true)

            if [ "$WEB_UPLOAD_STATUS" = "201" ]; then
              echo "Uploaded $WEB_ZIP_FILE to Codeberg release $RELEASE_ID"
              summary_row "- Codeberg mirror: ✅ web asset uploaded"
            else
              echo "::warning::Codeberg mirror failed: web asset upload returned status $WEB_UPLOAD_STATUS - $(jq -r .message /tmp/cb-web-upload.json 2>/dev/null || true)"
              summary_row "- Codeberg mirror: ⚠️ failed (web asset upload status $WEB_UPLOAD_STATUS)"
            fi
          fi

      - name: Prune old Codeberg release assets
        id: prune-codeberg
        env:
          MIRROR_CODEBERG_TOKEN: ${{ secrets.MIRROR_CODEBERG_TOKEN }}
          # Mirror coordinates — org variables shared with the landing.
          MIRROR_CODEBERG_URL: ${{ vars.MIRROR_CODEBERG_URL }}
          MOBILE_REPOSITORY_NAME: ${{ vars.MOBILE_REPOSITORY_NAME }}
          # Retention window: keep this many newest release zips. 10 zips of
          # 60-100MB stay well under Codeberg's ~1.5 GiB attachment soft quota.
          # Empty (variable not set) falls back to 10 in the script below.
          RELEASE_KEEP_COUNT: ${{ vars.RELEASE_KEEP_COUNT }}
        run: |
          summary_row() { printf '%s\n' "$1" | scripts/ci/step-summary.sh; }
          if [ -z "${MIRROR_CODEBERG_TOKEN:-}" ]; then
            echo "MIRROR_CODEBERG_TOKEN is not configured - skipping Codeberg prune"
            summary_row "- Codeberg prune: ⏭️ skipped (MIRROR_CODEBERG_TOKEN not set)"
            exit 0
          fi

          KEEP_COUNT="${RELEASE_KEEP_COUNT:-10}"
          case "$KEEP_COUNT" in
            ''|*[!0-9]*) KEEP_COUNT=10 ;;
            # Values beyond bash/CI sanity reset to the default: a count this
            # large overflows the integer comparison below and would prune
            # everything outside the current tag.
            ?????????*) KEEP_COUNT=10 ;;
          esac

          TAG="${{ github.ref_name }}"
          if [ -z "${MIRROR_CODEBERG_URL:-}" ] || [ -z "${MOBILE_REPOSITORY_NAME:-}" ]; then
            echo "::warning::MIRROR_CODEBERG_URL / MOBILE_REPOSITORY_NAME org variables are not set - skipping"
            summary_row "- Codeberg: ⚠️ skipped (MIRROR_CODEBERG_* / MOBILE_REPOSITORY_NAME not set)"
            exit 0
          fi
          # The URL carries the owner as its only path segment; Forgejo's API
          # lives OUTSIDE the owner path, so derive origin and owner from the
          # single URL — a host or owner rename is a variable change.
          CODEBERG_ORIGIN="${MIRROR_CODEBERG_URL%/*}"
          CODEBERG_ORG="${MIRROR_CODEBERG_URL%/}"
          CODEBERG_ORG="${CODEBERG_ORG##*/}"
          [ -n "$CODEBERG_ORIGIN" ] || {
            echo "::warning::CODEBERG_ORIGIN empty — MIRROR_CODEBERG_URL='${MIRROR_CODEBERG_URL:-}'"
            summary_row "- Codeberg prune: ⚠️ skipped (cannot derive API origin)"
            exit 0
          }
          API_BASE="$CODEBERG_ORIGIN/api/v1/repos/$CODEBERG_ORG/$MOBILE_REPOSITORY_NAME"
          AUTH_HEADER="Authorization: token ${MIRROR_CODEBERG_TOKEN}"

          # One page of 50 is far above the keep window; anything older was
          # already pruned by a previous run.
          RELEASES_STATUS=$(curl -s -o /tmp/cb-releases.json -w "%{http_code}" \
            -H "$AUTH_HEADER" \
            "$API_BASE/releases?limit=50" || true)

          if [ "$RELEASES_STATUS" != "200" ]; then
            echo "::warning::Codeberg prune failed: releases list returned status $RELEASES_STATUS from $API_BASE/releases?limit=50"
            summary_row "- Codeberg prune: ⚠️ failed (releases status $RELEASES_STATUS)"
            exit 0
          fi

          if ! jq -e 'type == "array"' /tmp/cb-releases.json >/dev/null 2>&1; then
            echo "::warning::Codeberg prune failed: unexpected releases payload"
            summary_row "- Codeberg prune: ⚠️ failed (unexpected releases payload)"
            exit 0
          fi

          # Newest first: created_at is the primary key, id breaks ties (the
          # endpoint already returns newest-first, but sort explicitly so the
          # keep window does not depend on server ordering). One release per
          # line with ALL .zip assets (APK + web bundle) resolved up front.
          jq -c 'sort_by([(.created_at // ""), .id]) | reverse | .[] | {id, tag: (.tag_name // ""), zips: [.assets[]? | select(.name | endswith(".zip")) | {id, name}]}' \
            /tmp/cb-releases.json > /tmp/cb-releases-sorted.jsonl || {
            echo "::warning::Codeberg prune failed: releases payload transform failed"
            summary_row "- Codeberg prune: ⚠️ failed (payload transform)"
            exit 0
          }

          KEPT=0
          PRUNED=0
          INDEX=0

          while IFS= read -r RELEASE; do
            [ -n "$RELEASE" ] || continue
            INDEX=$((INDEX + 1))

            RELEASE_ID=$(jq -r '.id' <<<"$RELEASE")
            RELEASE_TAG=$(jq -r '.tag' <<<"$RELEASE")
            ASSET_COUNT=$(jq -r '.zips | length' <<<"$RELEASE")

            WITHIN_WINDOW=false
            if [ "$INDEX" -le "$KEEP_COUNT" ]; then
              WITHIN_WINDOW=true
            fi
            # Defensive: never prune the release being published, even if it
            # falls outside the keep window.
            if [ "$RELEASE_TAG" = "$TAG" ]; then
              if [ "$WITHIN_WINDOW" = "false" ]; then
                echo "Keeping current release $RELEASE_TAG outside the keep window"
              fi
              WITHIN_WINDOW=true
            fi

            if [ "$WITHIN_WINDOW" = "true" ]; then
              KEPT=$((KEPT + ASSET_COUNT))
              continue
            fi

            # Only .zip attachments are pruned (APK + web bundle):
            # SHA256SUMS.txt is tiny and keeping it leaves old release pages
            # self-consistent.
            while IFS=$'\t' read -r ASSET_ID ASSET_NAME; do
              [ -n "$ASSET_ID" ] || continue

              DELETE_STATUS=$(curl -s -o /tmp/cb-delete.json -w "%{http_code}" -X DELETE \
                -H "$AUTH_HEADER" \
                "$API_BASE/releases/$RELEASE_ID/assets/$ASSET_ID" || true)

              if [ "$DELETE_STATUS" = "204" ]; then
                echo "Pruned $ASSET_NAME from Codeberg release $RELEASE_TAG"
                summary_row "- Codeberg prune: ✅ pruned $RELEASE_TAG ($ASSET_NAME)"
                PRUNED=$((PRUNED + 1))
              else
                echo "::warning::Codeberg prune failed for $RELEASE_TAG ($ASSET_NAME): status $DELETE_STATUS - $(jq -r .message /tmp/cb-delete.json 2>/dev/null || true)"
              fi
            done < <(jq -r '.zips[] | [.id, .name] | @tsv' <<<"$RELEASE")
          done < /tmp/cb-releases-sorted.jsonl

          summary_row "- Codeberg prune: kept newest $KEPT zips, pruned $PRUNED"

      # Footer: always runs, so the summary gets a verdict table even when a
      # step above failed. An empty outcome means the step never ran, not a pass.
      - name: Job summary
        if: always()
        env:
          CHANGELOG_OUTCOME: ${{ steps.changelog.outcome }}
          DOWNLOAD_ARTIFACTS_OUTCOME: ${{ steps.download-artifacts.outcome }}
          DOWNLOAD_WEB_OUTCOME: ${{ steps.download-web.outcome }}
          UPLOAD_APK_OUTCOME: ${{ steps.upload-apk.outcome }}
          MIRROR_GITHUB_OUTCOME: ${{ steps.mirror-github.outcome }}
          MIRROR_CODEBERG_OUTCOME: ${{ steps.mirror-codeberg.outcome }}
          PRUNE_CODEBERG_OUTCOME: ${{ steps.prune-codeberg.outcome }}
        run: |
          [ -f scripts/ci/step-summary.sh ] || exit 0
          status_emoji() {
            case "$1" in
              success) printf '✅' ;;
              failure) printf '❌' ;;
              cancelled) printf '🟨' ;;
              *) printf '⏭️' ;;
            esac
          }
          summary_row() { printf '| %s | %s |\n' "$1" "$(status_emoji "$2")"; }
          {
            echo ''
            echo '---'
            echo ''
            echo '| Step | Status |'
            echo '| --- | --- |'
            summary_row changelog "$CHANGELOG_OUTCOME"
            summary_row download-artifacts "$DOWNLOAD_ARTIFACTS_OUTCOME"
            summary_row download-web "$DOWNLOAD_WEB_OUTCOME"
            summary_row upload-apk "$UPLOAD_APK_OUTCOME"
            summary_row mirror-github "$MIRROR_GITHUB_OUTCOME"
            summary_row mirror-codeberg "$MIRROR_CODEBERG_OUTCOME"
            summary_row prune-codeberg "$PRUNE_CODEBERG_OUTCOME"
          } | scripts/ci/step-summary.sh || true

  ota:
    # JS-only mode: no native diff since the previous tag, so the installed APK
    # (same runtimeVersion) stays valid and the release is delivered through
    # expo-updates. Native releases ship a new APK and a new runtimeVersion,
    # which OTA could not deliver to already-installed builds.
    # No create-release dependency: a JS-only tag creates no release object.
    needs: changes
    if: needs.changes.outputs.native == 'false'
    runs-on: ubuntu-24.04

    concurrency:
      group: memory-heavy-jobs
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory
        id: yarn-cache-dir
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

      - name: Cache yarn dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      # The eoas CLI is fetched by `npx --yes eoas@<.eoas-version>`; keep npx's
      # package cache so a publish does not download it again.
      - name: Cache eoas CLI
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm/_npx
          key: ${{ runner.os }}-npx-eoas-${{ hashFiles('.eoas-version') }}

      # Metro's transform cache (os.tmpdir()/metro-cache) makes the bundle export
      # incremental. It is content-addressed, so restoring an older snapshot is
      # safe — stale entries are simply never hit; each run saves a new one.
      - name: Locate Metro cache
        id: metro-cache-dir
        run: echo "dir=$(node -p "require('path').join(require('os').tmpdir(), 'metro-cache')")" >> "$GITHUB_OUTPUT"

      - name: Cache Metro transforms
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.metro-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-metro-${{ hashFiles('yarn.lock', 'babel.config.js', 'metro.config.js') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-metro-${{ hashFiles('yarn.lock', 'babel.config.js', 'metro.config.js') }}-
            ${{ runner.os }}-metro-

      - name: Publish OTA update to xprem
        id: publish-ota
        env:
          # Inlined into the exported JS bundle (see src/shared/config/config.ts,
          # src/pages/share/lib/constants.ts) — the OTA bundle must target the same
          # prod hosts as the APK it is delivered to.
          EXPO_PUBLIC_BACKEND_API_HOSTNAME: ${{ vars.BACKEND_API_HOSTNAME }}
          EXPO_PUBLIC_LANDING_HOSTNAME: ${{ vars.LANDING_HOSTNAME }}
          EXPO_PUBLIC_WEB_HOSTNAME: ${{ vars.WEB_HOSTNAME }}
          # Repository coordinates (derived from the runner context) — release
          # sources, update allowlist.
          EXPO_PUBLIC_REPOSITORY_URL: ${{ github.server_url }}
          EXPO_PUBLIC_REPOSITORY_OWNER: ${{ github.repository_owner }}
          EXPO_PUBLIC_MIRROR_CODEBERG_URL: ${{ vars.MIRROR_CODEBERG_URL }}
          EXPO_PUBLIC_MIRROR_GITHUB_URL: ${{ vars.MIRROR_GITHUB_URL }}
          EXPO_PUBLIC_MOBILE_REPOSITORY_NAME: ${{ vars.MOBILE_REPOSITORY_NAME }}
          # xprem deployment values (Forgejo org/repo vars): `eoas publish` runs
          # `expo export`, which evaluates app.config.ts — without these the
          # exported bundle would carry `updates.enabled: false` and deliver
          # nothing. These are not secrets; move them to `secrets.` only if the
          # project decides to restrict who can read them.
          EXPO_PUBLIC_OTA_URL: ${{ vars.EXPO_PUBLIC_OTA_URL }}
          EXPO_PUBLIC_XPREM_APP_ID: ${{ vars.EXPO_PUBLIC_XPREM_APP_ID }}
          EXPO_PUBLIC_XPREM_CHANNEL_NAME: ${{ vars.EXPO_PUBLIC_XPREM_CHANNEL_NAME }}
          EXPO_PUBLIC_XPREM_BRANCH_NAME: ${{ vars.EXPO_PUBLIC_XPREM_BRANCH_NAME }}
          # Same Metro memory caps as the APK build — the 4 GB host is shared.
          NODE_OPTIONS: --max-old-space-size=1536
          CI_METRO_MAX_WORKERS: '2'
          XPREM_EOO_TOKEN: ${{ secrets.XPREM_EOO_TOKEN }}
          # Belt-and-suspenders: eoas aborts a non-interactive publish from a
          # dirty tracked tree. This job does not modify sources, but the flag
          # keeps the publish robust against future build steps.
          EAS_NO_VCS: '1'
        run: |
          summary_row() { printf '%s\n' "$1" | scripts/ci/step-summary.sh; }
          missing=0
          missing_list=""
          for v in XPREM_EOO_TOKEN EXPO_PUBLIC_OTA_URL EXPO_PUBLIC_XPREM_APP_ID EXPO_PUBLIC_XPREM_CHANNEL_NAME EXPO_PUBLIC_XPREM_BRANCH_NAME; do
            if [ -z "${!v:-}" ]; then
              echo "::warning::$v is not configured"
              missing=1
              missing_list="$missing_list \`$v\`"
            fi
          done
          if [ "$missing" -eq 1 ]; then
            printf '%s\n' "- OTA (xprem): ⏭️ skipped (missing$missing_list)" | scripts/ci/step-summary.sh
            exit 0
          fi

          # JS-only release: the APK (and its runtimeVersion) is unchanged, so
          # the whole release is delivered silently through expo-updates
          # (protocol v1 against our own xprem server); installed builds pick
          # the bundle up on the next cold start. The eoas CLI version lives in
          # .eoas-version (single source, bumped by Renovate) and must stay in
          # sync with the xprem server version. Any failure is non-fatal
          # (`::warning::`): this tag has no release object, so the OTA bundle
          # is its only delivery path — fix and re-run.
          EOAS_VERSION="$(cat .eoas-version)"
          if yarn install --frozen-lockfile && \
             EOO_TOKEN="$XPREM_EOO_TOKEN" npx --yes "eoas@${EOAS_VERSION}" publish \
               --branch "$EXPO_PUBLIC_XPREM_BRANCH_NAME" --platform android --nonInteractive; then
            echo "Published OTA update to branch $EXPO_PUBLIC_XPREM_BRANCH_NAME (android)"
            summary_row "- OTA (xprem): ✅ branch \`$EXPO_PUBLIC_XPREM_BRANCH_NAME\` (android)"
          else
            echo "::warning::OTA publish failed — continuing, re-run this workflow to retry (no release was created)"
            summary_row "- OTA (xprem): ⚠️ failed (see log)"
          fi

      # Footer: always runs, so the summary gets a verdict table even when a
      # step above failed. An empty outcome means the step never ran, not a pass.
      # This job writes no header anywhere else, so the footer emits one.
      - name: Job summary
        if: always()
        env:
          PUBLISH_OTA_OUTCOME: ${{ steps.publish-ota.outcome }}
        run: |
          [ -f scripts/ci/step-summary.sh ] || exit 0
          status_emoji() {
            case "$1" in
              success) printf '✅' ;;
              failure) printf '❌' ;;
              cancelled) printf '🟨' ;;
              *) printf '⏭️' ;;
            esac
          }
          summary_row() { printf '| %s | %s |\n' "$1" "$(status_emoji "$2")"; }
          {
            echo "## Release ${{ github.ref_name }} — ota"
            echo ''
            echo '| Step | Status |'
            echo '| --- | --- |'
            summary_row publish-ota "$PUBLISH_OTA_OUTCOME"
          } | scripts/ci/step-summary.sh || true

      - name: Cleanup workspace
        if: always()
        run: |
          rm -rf node_modules .yarn/cache .expo jest-cache dist 2>/dev/null || true
          find . -name '*.tsbuildinfo' -type f -delete 2>/dev/null || true
          find . -name '.cache' -type d -delete 2>/dev/null || true
