name: Release build

# Dispatch-only executor for the Forgejo orchestrator; native triggers are
# intentionally absent (the mirror must not build on tag pushes). Build
# artifacts hand off to Forgejo for signing/publishing.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'native | js-only'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  android:
    if: inputs.mode == 'native'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compute version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build unsigned APK
        uses: ./actions/release-android
        with:
          profile: hosted
          signing: none
          version: ${{ steps.version.outputs.version }}

      - name: Upload unsigned APK
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: unsigned-apk
          path: unsigned-apk/
          if-no-files-found: error
          retention-days: 30

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Export web build
        uses: ./actions/release-web
        with:
          profile: hosted

      - name: Upload web build
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30
