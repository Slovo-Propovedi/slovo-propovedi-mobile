# Composite action: build the prod release APK for the release pipeline.
#
# Shared by the GitHub-hosted release workflow and the Forgejo fallback path.
# The caller owns `actions/checkout`, `timeout-minutes` (composite steps do not
# support them), artifact upload and workspace cleanup.
#
# inputs:
#   profile   "constrained" (memory-limited runner: caps Gradle/Metro memory and
#             applies the jvmargs/workers overrides) or "hosted" (defaults).
#   signing   "env" — sign with the release keystore (RELEASE_* env), verify the
#             APK certificate against APK_SIGNER_SHA256 and produce
#             release-assets/ (zip + SHA256SUMS.txt);
#             "none" — build an unsigned APK (disable-release-signing.gradle)
#             and copy it into unsigned-apk/ for a later signing job.
#   version   release version without the leading "v" (e.g. 0.33.1).
#
# Env supplied by the caller (step-level `env:` on the `uses:` step):
#   BACKEND_API_HOSTNAME, LANDING_HOSTNAME, WEB_HOSTNAME, MIRROR_CODEBERG_URL,
#   MIRROR_GITHUB_URL, MOBILE_REPOSITORY_NAME  (required, validated up front)
#   EXPO_PUBLIC_* and EXPO_PUBLIC_OTA_*/*XPREM* values inlined by app.config.ts
#   signing=env only: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#                     ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, APK_SIGNER_SHA256

name: Build release APK
description: Prebuild, build and (optionally) sign the Android release APK.

inputs:
  profile:
    description: '"constrained" (memory-limited runner) or "hosted".'
    required: true
  signing:
    description: '"env" (sign with the release keystore) or "none" (unsigned APK).'
    required: true
  version:
    description: Release version without the leading "v" (e.g. 0.33.1).
    required: true

runs:
  using: composite
  steps:
    - name: Validate required vars
      id: validate
      shell: bash
      env:
        SIGNING: ${{ inputs.signing }}
      run: |
        set -e

        {
          echo "## Release ${{ github.ref_name }} — android"
          echo ''
        } | scripts/ci/step-summary.sh

        vars="BACKEND_API_HOSTNAME LANDING_HOSTNAME WEB_HOSTNAME MIRROR_CODEBERG_URL MIRROR_GITHUB_URL MOBILE_REPOSITORY_NAME"
        # APK_SIGNER_SHA256 only matters when this action signs the APK.
        if [ "$SIGNING" = "env" ]; then
          vars="$vars APK_SIGNER_SHA256"
        fi

        missing=0
        missing_list=""
        for v in $vars; do
          if [ -z "${!v:-}" ]; then
            echo "::error::Required variable $v is not set — refusing to build"
            missing=1
            missing_list="$missing_list \`$v\`"
          fi
        done
        # Pinned release certificate(s): 64-hex SHA-256 as printed by
        # `apksigner verify --print-certs`, comma-separated during a key rotation.
        if [ "$SIGNING" = "env" ] && [ -n "${APK_SIGNER_SHA256:-}" ] \
          && ! printf '%s' "$APK_SIGNER_SHA256" | grep -Eq '^[0-9A-Fa-f]{64}(,[0-9A-Fa-f]{64})*$'; then
          echo "::error::APK_SIGNER_SHA256 must be one or more comma-separated 64-hex SHA-256 digests"
          missing=1
          missing_list="$missing_list \`APK_SIGNER_SHA256\` (format)"
        fi
        if [ "$missing" -eq 1 ]; then
          printf '%s\n' "- Required vars: ❌ missing$missing_list" | scripts/ci/step-summary.sh
        else
          printf '%s\n' "- Required vars: ✅" | scripts/ci/step-summary.sh
        fi
        exit $missing

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 24

    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Get yarn cache directory
      id: yarn-cache-dir
      shell: bash
      run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

    - name: Cache yarn dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.yarn-cache-dir.outputs.dir }}
        key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-yarn-

    - name: Install dependencies
      shell: bash
      run: yarn install --frozen-lockfile

    - name: Setup Java JDK
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Restore Android SDK cache
      id: sdk-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: /opt/android-sdk
        key: ${{ runner.os }}-android-sdk-v2-
        restore-keys: |
          ${{ runner.os }}-android-sdk-v2-

    - name: Setup Android SDK
      shell: bash
      env:
        ANDROID_SDK_ROOT: /opt/android-sdk
        ANDROID_SDK_PACKAGES: platform-tools build-tools;36.0.0 build-tools;37.0.0 platforms;android-37.0
      run: bash scripts/ci/setup-android-sdk.sh

    - name: Cache Gradle dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    # The prebuild below runs with --clean and regenerates android/ from the
    # Expo template. The env values are inherited from the caller.
    - name: Prebuild native code
      id: prebuild
      shell: bash
      env:
        EXPO_PUBLIC_REPOSITORY_URL: ${{ github.server_url }}
        EXPO_PUBLIC_REPOSITORY_OWNER: ${{ github.repository_owner }}
      run: |
        start=$EPOCHSECONDS
        npx expo prebuild --platform android --clean
        printf '%s\n' "- Expo prebuild: ✅ ($((EPOCHSECONDS-start))s)" | scripts/ci/step-summary.sh

    - name: Verify prebuild versionCode
      id: verify-versioncode
      shell: bash
      run: |
        # expo prebuild regenerates android/app/build.gradle from app.config.ts,
        # so assert the regenerated value matches the release version.
        VERSION="${{ inputs.version }}"
        IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
        EXPECTED_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
        GRADLE_VERSION_CODE=$(grep 'versionCode' android/app/build.gradle | head -1 | sed 's/.*versionCode \([0-9]*\).*/\1/')
        if [ "$GRADLE_VERSION_CODE" != "$EXPECTED_CODE" ]; then
          echo "::error::prebuild regenerated build.gradle with versionCode ($GRADLE_VERSION_CODE) that does not match version ($EXPECTED_CODE) — check android.versionCode in app.config.ts"
          exit 1
        fi

    - name: Restore release keystore
      id: restore-keystore
      # prebuild --clean wipes android/, so the keystore must land here (after
      # the prebuild, before the build). A prod release MUST be signed with the
      # release key: publishing a debug-signed APK makes in-app updates fail.
      if: ${{ inputs.signing == 'env' }}
      shell: bash
      run: |
        if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
          echo "::error::ANDROID_KEYSTORE_BASE64 is not configured — refusing to publish a debug-signed release"
          printf '%s\n' "- APK signing: ❌ ANDROID_KEYSTORE_BASE64 is not configured — release aborted" | scripts/ci/step-summary.sh
          exit 1
        fi
        echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
        {
          echo "RELEASE_STORE_FILE=$GITHUB_WORKSPACE/android/app/release.keystore"
          echo "RELEASE_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
          echo "RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS"
          echo "RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
        } >> "$GITHUB_ENV"
        printf '%s\n' "- APK signing: release keystore 🔐" | scripts/ci/step-summary.sh

    - name: Configure Gradle for CI
      shell: bash
      run: |
        # Trim ABIs to arm64-v8a only (drop armeabi-v7a, x86, x86_64): halves
        # native-compilation memory/time peak. Applies to every profile.
        sed -i 's/reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' android/gradle.properties
        grep -q '^reactNativeArchitectures=arm64-v8a$' android/gradle.properties \
          || { echo '::error::reactNativeArchitectures override did not apply — sed pattern no longer matches the Expo template'; exit 1; }

        if [ "${{ inputs.profile }}" = "constrained" ]; then
          # Memory-limited runner: 1536m heap + 768m metaspace, in-process
          # Kotlin compilation (no separate daemon holding RAM) and capped
          # Gradle workers.
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m/' android/gradle.properties
          # printf with a leading \n: a prebuild template without a trailing
          # newline would merge this property into the previous line.
          printf '\nkotlin.compiler.execution.strategy=in-process\n' >> android/gradle.properties
          printf '\norg.gradle.workers.max=2\n' >> android/gradle.properties

          # Fail fast: if a future Expo SDK changes the template lines above, the
          # seds silently no-op and the build OOMs again with misleading logs.
          grep -q '^org.gradle.jvmargs=.*Xmx1536m.*MaxMetaspaceSize=768m' android/gradle.properties \
            || { echo '::error::gradle.properties jvmargs override did not apply — sed pattern no longer matches the Expo template'; exit 1; }
          grep -q '^kotlin.compiler.execution.strategy=in-process' android/gradle.properties \
            || { echo '::error::kotlin.compiler.execution.strategy append did not apply'; exit 1; }
          grep -q '^org.gradle.workers.max=2' android/gradle.properties \
            || { echo '::error::workers.max append did not apply'; exit 1; }
        fi

    - name: Check runner resources
      shell: bash
      run: |
        df -h /
        free -h
        cat /sys/fs/cgroup/memory.max 2>/dev/null || true

    - name: Build APK
      id: build-apk
      shell: bash
      env:
        # NODE_OPTIONS caps the Metro bundler heap; CI_METRO_MAX_WORKERS caps
        # Metro transform workers (each holds ASTs in RAM).
        NODE_OPTIONS: --max-old-space-size=1536
        CI_METRO_MAX_WORKERS: '2'
        EXPO_PUBLIC_REPOSITORY_URL: ${{ github.server_url }}
        EXPO_PUBLIC_REPOSITORY_OWNER: ${{ github.repository_owner }}
      run: |
        cd android
        free -h
        # The config plugin already disables lintVital* tasks; the init script is
        # belt-and-suspenders. `none` builds unsigned: the release signingConfig
        # is cleared so the output is app-prod-release-unsigned.apk.
        init_scripts=(--init-script ../scripts/gradle/disable-lint-vital.gradle)
        if [ "${{ inputs.signing }}" = "none" ]; then
          init_scripts+=(--init-script ../scripts/gradle/disable-release-signing.gradle)
        fi
        start=$EPOCHSECONDS
        nice -n 19 ionice -c 3 ./gradlew assembleProdRelease --no-daemon -Dorg.gradle.parallel=false "${init_scripts[@]}"
        df -h /
        printf '%s\n' "- APK build (arm64-v8a): ✅ ($((EPOCHSECONDS-start))s)" | ../scripts/ci/step-summary.sh

    - name: Verify APK signing certificate
      id: verify-signing
      if: ${{ inputs.signing == 'env' }}
      shell: bash
      run: |
        set -euo pipefail
        APK_PATH=$(find android/app/build/outputs -name "*.apk" -print -quit)
        if [ -z "$APK_PATH" ]; then
          echo "::error::No release APK found to verify"
          exit 1
        fi
        APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 -name apksigner -type f 2>/dev/null | sort -V | tail -1)
        if [ -z "$APKSIGNER" ]; then
          echo "::error::apksigner not found under $ANDROID_SDK_ROOT/build-tools"
          exit 1
        fi
        PINNED=$(printf '%s' "$APK_SIGNER_SHA256" | tr -d '[:space:]' | tr 'A-F' 'a-f')
        if ! OUTPUT=$("$APKSIGNER" verify --print-certs "$APK_PATH" 2>/dev/null); then
          echo "::error::apksigner could not verify $APK_PATH"
          printf '%s\n' "- APK signer: ❌ signature does not verify — release aborted" | scripts/ci/step-summary.sh
          exit 1
        fi
        DIGESTS=$(printf '%s\n' "$OUTPUT" \
          | sed -n 's/.*[Ss]igner.*certificate SHA-256 digest: *\([0-9A-Fa-f]\{64\}\).*/\1/p' \
          | tr 'A-F' 'a-f' | sort -u)
        if printf '%s' "$DIGESTS" | grep -Eqx '[0-9a-f]{64}' && case ",$PINNED," in *",$DIGESTS,"*) true ;; *) false ;; esac; then
          echo "APK signed with the pinned release certificate: $DIGESTS"
          printf '%s\n' "- APK signer: ✅ pinned release certificate (\`${DIGESTS:0:16}…\`)" | scripts/ci/step-summary.sh
        else
          echo "::error::APK is not signed with the pinned release certificate (got: ${DIGESTS:-none}) — check the ANDROID_KEYSTORE_* secrets"
          printf '%s\n' "- APK signer: ❌ unexpected certificate (\`${DIGESTS:-none}\`) — release aborted" | scripts/ci/step-summary.sh
          exit 1
        fi

    - name: Rename and zip APK
      id: zip-apk
      if: ${{ inputs.signing == 'env' }}
      shell: bash
      run: |
        APK_PATH=$(find android/app/build/outputs -name "*.apk" -print -quit)
        if [ -z "$APK_PATH" ]; then
          echo "::error::No release APK found to package"
          exit 1
        fi
        VERSION="${{ inputs.version }}"
        RENAMED="Slovo.Propovedi v${VERSION}.apk"
        mkdir -p release-assets
        cp "$APK_PATH" "release-assets/$RENAMED"
        (cd release-assets && zip -j "slovo-propovedi-v${VERSION}.zip" "$RENAMED")
        # Integrity contract: the client verifies this digest before unpacking.
        (cd release-assets && sha256sum "slovo-propovedi-v${VERSION}.zip" > SHA256SUMS.txt)
        {
          echo "- APK: \`$RENAMED\`"
          echo "- Artifact: \`slovo-propovedi-v${VERSION}.zip\` ($(du -h "release-assets/slovo-propovedi-v${VERSION}.zip" | cut -f1))"
          echo "- Checksums: \`SHA256SUMS.txt\` ($(cat "release-assets/SHA256SUMS.txt"))"
        } | scripts/ci/step-summary.sh

    - name: Collect unsigned APK
      id: collect-unsigned
      if: ${{ inputs.signing == 'none' }}
      shell: bash
      run: |
        APK_PATH=$(find android/app/build/outputs -name "*.apk" -print -quit)
        if [ -z "$APK_PATH" ]; then
          echo "::error::No unsigned APK found"
          exit 1
        fi
        mkdir -p unsigned-apk
        cp "$APK_PATH" unsigned-apk/
        printf '%s\n' "- Unsigned APK: ✅ \`$(basename "$APK_PATH")\` → \`unsigned-apk/\`" | scripts/ci/step-summary.sh

    # Snapshot key is computed after the build so NDK/CMake installed by Gradle
    # during assembleProdRelease are part of the cache (release.yml semantics).
    - name: Compute Android SDK cache key
      id: sdk-cache-key
      if: ${{ !cancelled() }}
      shell: bash
      run: bash scripts/ci/android-sdk-cache-key.sh

    - name: Save Android SDK cache
      if: ${{ !cancelled() && steps.sdk-cache-key.outputs.key != '' && steps.sdk-cache-key.outputs.key != steps.sdk-cache.outputs.cache-matched-key }}
      continue-on-error: true
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: /opt/android-sdk
        key: ${{ steps.sdk-cache-key.outputs.key }}

    - name: Job summary
      if: always()
      shell: bash
      run: |
        [ -f scripts/ci/step-summary.sh ] || exit 0
        status_emoji() {
          case "$1" in
            success) printf '✅' ;;
            failure) printf '❌' ;;
            cancelled) printf '🟨' ;;
            *) printf '⏭️' ;;
          esac
        }
        summary_row() { printf '| %s | %s |\n' "$1" "$(status_emoji "$2")"; }
        {
          echo ''
          echo '---'
          echo ''
          echo '| Step | Status |'
          echo '| --- | --- |'
          summary_row validate "${{ steps.validate.outcome }}"
          summary_row prebuild "${{ steps.prebuild.outcome }}"
          summary_row verify-versioncode "${{ steps.verify-versioncode.outcome }}"
          summary_row restore-keystore "${{ steps.restore-keystore.outcome }}"
          summary_row build-apk "${{ steps.build-apk.outcome }}"
          summary_row verify-signing "${{ steps.verify-signing.outcome }}"
          summary_row zip-apk "${{ steps.zip-apk.outcome }}"
          summary_row collect-unsigned "${{ steps.collect-unsigned.outcome }}"
        } | scripts/ci/step-summary.sh || true
